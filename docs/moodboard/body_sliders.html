<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body sliders</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#c6ff3d}a:hover{color:#dcfb7b}
</style>

<div style="width: 1560px; height: 1160px; box-sizing: border-box; padding: 48px 56px; background: #12061f; color: #f6eeff; font-family: 'Space Mono', monospace; display: flex; flex-direction: column; gap: 32px">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">

      <p style="margin: 0; font-size: 15px; color: #c9b8e8">One character, every slider stop · cartoon extremes · starter outfit</p>
    </div>
    <p style="margin: 0; font-size: 13px; color: #c9b8e8; text-align: right">Sprites: 52×64 px, shown at 4×<br>Left to right: fat · top to bottom: muscle</p>
  </div>
  <div style="display: flex; gap: 48px">
      <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 28px; text-transform: uppercase; color: #c6ff3d">Male</h2>

          <span style="font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 16px; text-align: center; color: #c9b8e8">FAT 100</span>
          <span style="font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 16px; color: #c9b8e8; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); justify-self: center">MUSCLE 0</span>
          <img src="body_sliders/male/fat0_muscle0.png" alt="Male body at fat 0, muscle 0" style="width: 208px; height: 256px; image-rendering: pixelated; justify-self: center">
          <img src="body_sliders/male/fat50_muscle0.png" alt="Male body at fat 50, muscle 0" style="width: 208px; height: 256px; image-rendering: pixelated; justify-self: center">
          <img src="body_sliders/male/fat100_muscle0.png" alt="Male body at fat 100, muscle 0" style="width: 208px; height: 256px; image-rendering: pixelated; justify-self: center">
          <span style="font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 16px; color: #c9b8e8; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); justify-self: center">MUSCLE 50</span>
          <img src="body_sliders/male/fat0_muscle50.png" alt="Male body at fat 0, muscle 50" style="width: 208px; height: 256px; image-rendering: pixelated; justify-self: center">

        </div>
      </div>

          <span style="font-family: Anton, Impact, sans-serif; font-weight: 400; letter-spacing: 1px; font-size: 16px; text-align: center; color: #c9b8e8">FAT 100</span>

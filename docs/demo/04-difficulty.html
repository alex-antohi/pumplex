<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Difficulty</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<style>
/* ---------- 04 difficulty: screen-only styles (.dif-…) ---------- */
.dif-screen { display: flex; flex-direction: column; gap: var(--s3); padding-top: var(--s3); }
.dif-head .title { font-size: 36px; }

/* selected-rung card: emblem + name + one-liner + XP badge */
.dif-card {
  --t: var(--line);
  position: relative;
  display: flex; gap: var(--s3); align-items: center;
  min-height: 132px;
  padding: var(--s3);
  box-shadow: 6px 6px 0 var(--t);
}
.dif-emblem { flex: none; width: 72px; height: 88px; }
.dif-emblem svg { display: block; width: 72px; height: 88px; shape-rendering: crispEdges; }
.dif-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s1); }
.dif-rank { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.dif-name {
  font-family: var(--display); font-size: 28px; line-height: 1; letter-spacing: 1px; text-transform: uppercase;
  color: var(--t); text-shadow: 2px 2px 0 var(--ink);
}
.dif-line { margin: 0; font-size: 13px; line-height: 1.35; color: var(--text); font-weight: 700; }
.dif-badge {
  position: absolute; right: -6px; top: -14px;
  font-family: var(--display); font-size: 22px; line-height: 1; letter-spacing: 1px;
  color: var(--ink); background: var(--t);
  border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 4px 10px 3px;
  transform: rotate(4deg);
}
.dif-badge[hidden] { display: none; }
.dif-card.is-empty .dif-name { color: var(--muted); font-size: 24px; }
.dif-card.is-empty .dif-line { color: var(--muted); font-weight: 400; }
.dif-card.hit .dif-emblem { animation: dif-pop .24s steps(3, end) both; }
.dif-card.hit .dif-badge { animation: dif-stamp .3s steps(4, end) both; }
@keyframes dif-pop { 0% { transform: translateY(8px) scale(.7); } 100% { transform: none; } }
@keyframes dif-stamp { 0% { transform: rotate(14deg) scale(1.9); opacity: 0; } 100% { transform: rotate(4deg) scale(1); opacity: 1; } }

/* the ladder: two rails behind the rungs, bottom rung = beginner */
.dif-ladder { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0 16px; margin-top: var(--s2); }
.dif-ladder::before, .dif-ladder::after {
  content: ""; position: absolute; top: -10px; bottom: -6px; width: 12px;
  background: repeating-linear-gradient(180deg, var(--line) 0 10px, var(--violet-lo) 10px 12px);
  border-left: 2px solid var(--ink); border-right: 2px solid var(--ink);
}
.dif-ladder::before { left: 4px; }
.dif-ladder::after { right: 4px; }
.dif-ladder .pick {
  position: relative; z-index: 1;
  min-height: 44px; padding: 0 var(--s3) 0 var(--s2);
  justify-content: flex-start;
  border-left: 8px solid var(--pick-c);
}
.dif-ladder .pick b { flex: 1; font-size: 19px; }
.dif-ladder .pick:focus-visible { outline: 3px dashed var(--text); outline-offset: 3px; z-index: 2; }
.dif-ladder .pick:active { transform: translate(3px, 3px); box-shadow: none; }
.dif-ladder .pick[aria-checked="true"] { box-shadow: 4px 4px 0 var(--pink); border-left-color: var(--ink); }
.dif-ladder .pick[aria-checked="true"]::after {
  content: "YOU"; position: absolute; left: -10px; top: 50%; margin-top: -10px; z-index: 2;
  font-size: 10px; font-weight: 700; letter-spacing: 1px; line-height: 14px;
  background: var(--pink); color: var(--ink); border: 2px solid var(--ink); padding: 1px 3px;
}
.dif-ladder .pick[aria-checked="true"] b { padding-left: 22px; }

/* the difficulty meter on each rung: 8 rising bars, no numbers */
.dif-meter { flex: none; display: flex; align-items: flex-end; gap: 2px; height: 22px; }
.dif-meter i { width: 5px; background: var(--raised); border: 1px solid var(--ink); }
.dif-meter i.on { background: var(--pick-c); }
.pick[aria-checked="true"] .dif-meter i { background: rgba(11, 4, 20, .18); }
.pick[aria-checked="true"] .dif-meter i.on { background: var(--ink); }

.dif-ends { display: flex; justify-content: space-between; padding: 0 var(--s2); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.dif-hint {
  margin: var(--s1) 0 0; display: flex; gap: var(--s2); align-items: flex-start;
  font-size: 12px; line-height: 1.4; color: var(--muted);
}
.dif-hint .nametag { flex: none; font-size: 10px; padding: 0 6px; }
.dif-hint b { color: var(--text); }
</style>
</head>
<body class="px">
<main class="phone" data-screen="difficulty">
  <header class="topbar">
    <button class="icon-btn" type="button" id="dif-back" aria-label="Back to class"></button>
    <div class="steps" role="img" aria-label="Setup step 3 of 5"><i class="on"></i><i class="on"></i><i class="now"></i><i></i><i></i></div>
  </header>

  <section class="screen dif-screen">
    <div class="dif-head">
      <p class="kicker">STEP 3 OF 5 · PICK YOUR RUNG</p>
      <h1 class="title">How hard do you go?</h1>
    </div>

    <div class="dif-card stage is-empty" id="dif-card" aria-live="polite">
      <div class="dif-emblem" id="dif-emblem"></div>
      <div class="dif-info">
        <span class="dif-rank" id="dif-rank">RUNG UNKNOWN</span>
        <span class="dif-name" id="dif-name">No rung yet</span>
        <p class="dif-line" id="dif-line">Climb as high as your lifting history goes. Higher rungs pay more XP.</p>
      </div>
      <span class="dif-badge" id="dif-badge" hidden></span>
    </div>

    <div>
      <div class="dif-ladder" role="radiogroup" aria-label="Difficulty" id="dif-ladder"></div>
      <p class="dif-hint"><span class="nametag" style="--tag-c: var(--sky)">TIP</span>
        <span><b>Not sure? Pick lower.</b> Crushing it beats getting crushed. You can switch rungs any time in your profile.</span></p>
    </div>
  </section>

  <footer class="foot">
    <button class="btn cta" type="button" id="dif-next" disabled>NEXT: STARTING AREA</button>
  </footer>
</main>

<script>
(function () {
  "use strict";
  if (!PX.require(["cls"], "class")) return;

  var $ = function (id) { return document.getElementById(id); };
  var card = $("dif-card"), ladder = $("dif-ladder"), next = $("dif-next");
  var L = PX.DIFFICULTIES, N = L.length, picked = null, buttons = [];

  $("dif-back").innerHTML = PX.icon("back");
  $("dif-back").onclick = function () { PX.go("class"); };

  /* ---------- pixel rank emblem: a shield on an 18x22 grid ----------
     tiers 1-4: 1-4 chevrons; 5-8: chevrons again plus wings; top tier also gets a crown. */
  function r(x, y, w, h, f) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + f + '"/>'; }
  var SHIELD = [[2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15],
                [3, 14], [4, 13], [5, 12], [6, 11], [7, 10], [8, 9]];
  function emblem(tier, color) {
    var s = "", ink = "var(--ink)", y0 = 4, i, row;
    var base = color ? PX.c(color) : "var(--raised)", hi = color ? PX.c(color, "hi") : "var(--line)", lo = color ? PX.c(color, "lo") : "var(--surface)";
    if (tier >= 5) { /* wings */
      s += r(0, 6, 3, 6, ink) + r(1, 7, 2, 4, hi) + r(15, 6, 3, 6, ink) + r(15, 7, 2, 4, hi);
      s += r(0, 12, 2, 2, ink) + r(16, 12, 2, 2, ink);
    }
    for (i = 0; i < SHIELD.length; i++) { row = SHIELD[i]; s += r(row[0], y0 + i, row[1] - row[0] + 1, 1, ink); }
    for (i = 1; i < SHIELD.length - 1; i++) {
      row = SHIELD[i]; var a = row[0] + 1, b = row[1] - 1; if (b < a) continue;
      s += r(a, y0 + i, b - a + 1, 1, base);
      if (i < 12) { s += r(a, y0 + i, 1, 1, hi); s += r(b, y0 + i, 1, 1, lo); }
    }
    s += r(3, y0 + 1, 12, 1, hi);
    if (!color) { /* empty: a pixel question mark */
      var q = "var(--muted)";
      return wrap(s + r(7, 8, 4, 2, q) + r(11, 9, 2, 3, q) + r(9, 12, 2, 2, q) + r(8, 13, 2, 2, q) + r(8, 17, 2, 2, q) + r(5, 9, 2, 2, q));
    }
    var n = ((tier - 1) % 4) + 1, top = y0 + 1 + Math.round((4 - n) * 1.5);
    for (i = 0; i < n; i++) { /* stacked chevrons pointing up: climbing */
      var y = top + i * 3;
      s += r(8, y, 2, 1, ink) + r(6, y + 1, 2, 1, ink) + r(10, y + 1, 2, 1, ink) + r(4, y + 2, 2, 1, ink) + r(12, y + 2, 2, 1, ink);
    }
    if (tier === N) { /* crown */
      var g = "var(--orange-hi)";
      s += r(4, 0, 2, 4, ink) + r(8, 0, 2, 4, ink) + r(12, 0, 2, 4, ink) + r(4, 2, 10, 2, ink);
      s += r(4, 0, 1, 3, g) + r(8, 0, 1, 3, g) + r(12, 0, 1, 3, g) + r(5, 2, 8, 1, g);
    }
    return wrap(s);
  }
  function wrap(inner) { return '<svg viewBox="0 0 18 22" aria-hidden="true">' + inner + "</svg>"; }

  function fmtMult(m) { return "XP x" + (Math.round(m * 100) / 100).toString(); }

  /* ---------- ladder: top rung first in the DOM, so the list reads as a climb ---------- */
  for (var k = N - 1; k >= 0; k--) {
    (function (d, tier) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "pick"; b.dataset.id = d.id;
      b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false"); b.tabIndex = -1;
      b.setAttribute("aria-label", d.name + ", rank " + tier + " of " + N + ". " + d.line);
      b.style.setProperty("--pick-c", PX.c(d.color));
      var bars = "";
      for (var j = 1; j <= N; j++) bars += '<i class="' + (j <= tier ? "on" : "") + '" style="height:' + (6 + j * 2) + 'px"></i>';
      b.innerHTML = "<b></b><span class=\"dif-meter\" aria-hidden=\"true\">" + bars + "</span>";
      b.firstChild.textContent = d.name;
      b.onclick = function () { pick(d.id, true); };
      ladder.appendChild(b); buttons.push(b);
    })(L[k], k + 1);
  }

  /* arrow keys climb the ladder like a native radio group (up = harder) */
  ladder.addEventListener("keydown", function (e) {
    var i = picked ? indexOf(picked) : -1, d = 0;
    if (e.key === "ArrowUp" || e.key === "ArrowRight") d = 1;
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") d = -1;
    else return;
    e.preventDefault();
    var j = i < 0 ? 0 : Math.max(0, Math.min(N - 1, i + d));
    pick(L[j].id, true);
    btnFor(L[j].id).focus();
  });
  function indexOf(id) { for (var i = 0; i < N; i++) if (L[i].id === id) return i; return -1; }
  function btnFor(id) { for (var i = 0; i < buttons.length; i++) if (buttons[i].dataset.id === id) return buttons[i]; return null; }

  function render() {
    var i = picked ? indexOf(picked) : -1, d = i >= 0 ? L[i] : null;
    buttons.forEach(function (b) {
      var on = !!d && b.dataset.id === d.id;
      b.setAttribute("aria-checked", on ? "true" : "false");
      b.tabIndex = on || (!d && b.dataset.id === L[0].id) ? 0 : -1;
    });
    card.classList.toggle("is-empty", !d);
    $("dif-emblem").innerHTML = emblem(d ? i + 1 : 0, d ? d.color : null);
    if (d) {
      card.style.setProperty("--t", PX.c(d.color));
      $("dif-rank").textContent = i === N - 1 ? "TOP RUNG" : i === 0 ? "BOTTOM RUNG" : "RUNG " + (i + 1) + " OF " + N;
      $("dif-name").textContent = d.name;
      $("dif-line").textContent = d.line;
      $("dif-badge").textContent = fmtMult(d.mult);
      $("dif-badge").hidden = false;
    } else {
      card.style.removeProperty("--t");
      $("dif-badge").hidden = true;
    }
    next.disabled = !d;
  }

  function pick(id, feedback) {
    if (indexOf(id) < 0) return;
    picked = id;
    PX.save({ difficulty: id });
    render();
    if (feedback) { card.classList.remove("hit"); void card.offsetWidth; card.classList.add("hit"); }
  }

  next.onclick = function () { if (picked) PX.go("area"); };

  var saved = PX.get().difficulty;
  if (saved && indexOf(saved) >= 0) picked = saved;
  render();
})();
</script>
</body>
</html>

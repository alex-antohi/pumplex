<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Difficulty</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<style>
/* ---------- 04 difficulty: screen-only styles (.dif-…) ---------- */
.dif-screen { display: flex; flex-direction: column; gap: var(--s3); padding-top: var(--s3); }

/* the rung card: everything about one rung on one card */
.dif-card {
  --t: var(--line);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; gap: var(--s2);
  min-height: 430px; padding: var(--s5) var(--s5) var(--s4);
  text-align: center;
  background:
    radial-gradient(color-mix(in srgb, var(--t) 34%, transparent) 2px, transparent 2.5px) 0 0 / 20px 20px,
    var(--raised);
  border: var(--border-thick);
  box-shadow: 8px 8px 0 var(--t);
  margin-right: 8px;
}
/* stripes that thicken with the rung: the card itself gets heavier */
.dif-card::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--heat, 20%);
  background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--t) 30%, transparent) 0 10px, transparent 10px 20px);
  border-top: 3px solid var(--ink);
  pointer-events: none;
}
.dif-card > * { position: relative; }
.dif-emblem { width: var(--em, 96px); height: calc(var(--em, 96px) * 22 / 18); flex: none; margin-top: var(--s2); }
.dif-emblem svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; filter: drop-shadow(4px 4px 0 var(--ink)); }
.dif-rank { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: var(--s2); }
.dif-name {
  font-family: var(--display); font-size: 36px; line-height: 1; letter-spacing: 1px; text-transform: uppercase;
  color: var(--t); text-shadow: 3px 3px 0 var(--ink);
  text-wrap: balance;
}
.dif-line { margin: 0; max-width: 270px; font-size: 14px; line-height: 1.4; color: var(--text); font-weight: 700; }
.dif-gems { margin-top: var(--s2); padding: 6px 10px; background: var(--ink); border: 3px solid var(--t); }
.dif-xp { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--t); }

.dif-hint {
  margin: 0; display: flex; gap: var(--s2); align-items: flex-start;
  font-size: 12px; line-height: 1.4; color: var(--muted);
}
.dif-hint .nametag { flex: none; font-size: 10px; padding: 0 6px; }
.dif-hint b { color: var(--text); }
</style>
</head>
<body class="px">
<main class="phone" data-screen="difficulty">
  <header class="topbar setup-top">
    <button class="icon-btn" type="button" id="dif-back" aria-label="Back to class"></button>
    <div class="setup-t">
      <div class="setup-k"><p class="kicker" id="dif-kicker">STEP 3 OF 5</p><div class="steps" role="img" aria-label="Setup step 3 of 5"><i class="on"></i><i class="on"></i><i class="now"></i><i></i><i></i></div></div>
      <h1 class="title">How hard do you go?</h1>
    </div>
  </header>

  <section class="screen dif-screen">
    <div id="dif-pick" role="group" aria-roledescription="carousel" aria-label="Difficulty"></div>
    <p class="swp-hint">Swipe to climb. Higher rungs earn more XP.</p>
    <p class="dif-hint"><span class="nametag" style="--tag-c: var(--sky)">TIP</span>
      <span><b>Not sure? Pick lower.</b> Crushing it beats getting crushed. You can switch rungs any time in your profile.</span></p>
  </section>

  <footer class="foot">
    <button class="btn cta" type="button" id="dif-next">NEXT: STARTING AREA</button>
  </footer>
</main>

<script>
(function () {
  "use strict";
  if (!PX.require(["cls"], "class")) return;

  var $ = function (id) { return document.getElementById(id); };
  var next = $("dif-next");
  var L = PX.DIFFICULTIES, N = L.length;

  $("dif-back").innerHTML = PX.icon("back");
  $("dif-back").onclick = function () { PX.go("class"); };

  /* ---------- pixel rank emblem: a shield on an 18x22 grid ----------
     tiers 1-4: 1-4 chevrons; 5-8: chevrons again plus wings; top tier also gets a crown. */
  function r(x, y, w, h, f) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + f + '"/>'; }
  var SHIELD = [[2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15], [2, 15],
                [3, 14], [4, 13], [5, 12], [6, 11], [7, 10], [8, 9]];
  function emblem(tier, color) {
    var s = "", ink = "var(--ink)", y0 = 4, i, row;
    var base = color ? PX.c(color) : "var(--raised)", hi = color ? PX.c(color, "hi") : "var(--line)", lo = color ? PX.c(color, "lo") : "var(--surface)";
    if (tier >= 5) { /* wings */
      s += r(0, 6, 3, 6, ink) + r(1, 7, 2, 4, hi) + r(15, 6, 3, 6, ink) + r(15, 7, 2, 4, hi);
      s += r(0, 12, 2, 2, ink) + r(16, 12, 2, 2, ink);
    }
    for (i = 0; i < SHIELD.length; i++) { row = SHIELD[i]; s += r(row[0], y0 + i, row[1] - row[0] + 1, 1, ink); }
    for (i = 1; i < SHIELD.length - 1; i++) {
      row = SHIELD[i]; var a = row[0] + 1, b = row[1] - 1; if (b < a) continue;
      s += r(a, y0 + i, b - a + 1, 1, base);
      if (i < 12) { s += r(a, y0 + i, 1, 1, hi); s += r(b, y0 + i, 1, 1, lo); }
    }
    s += r(3, y0 + 1, 12, 1, hi);
    if (!color) { /* empty: a pixel question mark */
      var q = "var(--muted)";
      return wrap(s + r(7, 8, 4, 2, q) + r(11, 9, 2, 3, q) + r(9, 12, 2, 2, q) + r(8, 13, 2, 2, q) + r(8, 17, 2, 2, q) + r(5, 9, 2, 2, q));
    }
    var n = ((tier - 1) % 4) + 1, top = y0 + 1 + Math.round((4 - n) * 1.5);
    for (i = 0; i < n; i++) { /* stacked chevrons pointing up: climbing */
      var y = top + i * 3;
      s += r(8, y, 2, 1, ink) + r(6, y + 1, 2, 1, ink) + r(10, y + 1, 2, 1, ink) + r(4, y + 2, 2, 1, ink) + r(12, y + 2, 2, 1, ink);
    }
    if (tier === N) { /* crown */
      var g = "var(--orange-hi)";
      s += r(4, 0, 2, 4, ink) + r(8, 0, 2, 4, ink) + r(12, 0, 2, 4, ink) + r(4, 2, 10, 2, ink);
      s += r(4, 0, 1, 3, g) + r(8, 0, 1, 3, g) + r(12, 0, 1, 3, g) + r(5, 2, 8, 1, g);
    }
    return wrap(s);
  }
  function wrap(inner) { return '<svg viewBox="0 0 18 22" aria-hidden="true">' + inner + "</svg>"; }

  var edit = PX.editMode();

  var saved = PX.get().difficulty, start = Math.max(0, indexOf(saved));
  function indexOf(id) { for (var i = 0; i < N; i++) if (L[i].id === id) return i; return -1; }

  function renderCard(el, i) {
    var d = L[i], col = PX.c(d.color);
    el.className = "swp-card dif-card";
    el.style.setProperty("--t", col);
    el.style.setProperty("--heat", (12 + i * 9) + "%");
    el.style.setProperty("--em", (84 + i * 6) + "px");
    el.setAttribute("role", "tabpanel");
    el.setAttribute("aria-label", d.name + ", rung " + (i + 1) + " of " + N + ". " + d.line);
    el.innerHTML = '<div class="dif-emblem">' + emblem(i + 1, d.color) + '</div>' +
      '<span class="dif-rank">RUNG ' + (i + 1) + " OF " + N + "</span>" +
      '<span class="dif-name"></span><p class="dif-line"></p>' +
      '<span class="dif-gems">' + PX.gems(d, 20) + "</span>" +
      '<span class="dif-xp">' + ["BASE XP", "A BIT MORE XP", "MORE XP", "LOTS MORE XP", "HEAPS MORE XP", "DOUBLE XP"][i] + "</span>";
    el.querySelector(".dif-name").textContent = d.name;
    el.querySelector(".dif-line").textContent = d.line;
  }

  var picker = PX.picker({
    root: $("dif-pick"), count: N, index: start,
    color: function (i) { return PX.c(L[i].color); },
    label: function (i) { return L[i].name; },
    render: renderCard,
    onChange: function (i) { PX.save({ difficulty: L[i].id }); }
  });
  PX.save({ difficulty: L[start].id });

  next.onclick = function () {
    if (edit) { PX.toast("RUNG CHANGED. NEW WORKOUTS FROM THE NEXT SESSION.", { ms: 1400 }); setTimeout(function () { PX.go("profile"); }, 900); }
    else PX.go("area");
  };
  if (edit) {
    $("dif-kicker").textContent = "PROFILE · CHANGE DIFFICULTY"; $("dif-kicker").classList.add("edit-kicker");
    document.querySelector(".steps").hidden = true;
    next.textContent = "SAVE RUNG";
    $("dif-back").setAttribute("aria-label", "Back to the profile");
    $("dif-back").onclick = function () { PX.go("profile"); };
  }
})();
</script>
</body>
</html>

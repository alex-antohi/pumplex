<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Hub</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<style>
/* ---------- Hub (screen 7): the lifter in their world, the level, the next workout, one big START ---------- */
.hub-screen { padding: 0; display: flex; flex-direction: column; }

/* the world: dark sky, light floor, the lifter at 4x */
.hub-scene { position: relative; height: 318px; flex: none; overflow: hidden; background: var(--hub-sky, #1f0d36); border-bottom: 4px solid var(--ink); }
.hub-scene > * { position: absolute; }
.hub-scene .hub-art > * { position: absolute; }
.hub-art { inset: 0; }
.hub-floor { left: 0; right: 0; bottom: 0; height: 86px; background: var(--hub-floor); border-top: 4px solid var(--ink); box-shadow: inset 0 6px 0 var(--hub-floor-hi, rgba(246, 238, 255, .35)); }
.hub-stars { inset: 0 0 86px 0; background-image: radial-gradient(#f6eeff 1px, transparent 1.6px), radial-gradient(#c9b8e8 1px, transparent 1.6px); background-size: 41px 31px, 67px 47px; background-position: 5px 7px, 23px 19px; animation: hub-twinkle 2.4s steps(2, end) infinite; }

/* HUD over the sky: wordmark and menu */
.hub-mark { left: var(--s4); top: var(--s3); z-index: 8; font-family: var(--display); font-size: 26px; letter-spacing: 1px; line-height: 1; color: var(--text); text-shadow: 2px 2px 0 var(--pink), 4px 4px 0 var(--violet-lo); }
.hub-mark sup { font-family: var(--body); font-size: 9px; font-weight: 700; vertical-align: top; margin-left: 1px; text-shadow: none; }
.hub-where { left: var(--s4); top: 46px; z-index: 8; font-family: var(--body); font-weight: 700; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--hub-acc); background: var(--ink); padding: 2px 6px; }
.hub-menu { right: var(--s4); top: var(--s3); z-index: 8; }

/* the lifter: a button, tap to flex */
.hub-lifter { left: 28px; bottom: 40px; z-index: 6; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; touch-action: manipulation; }
.hub-lifter:focus-visible { outline: 3px dashed var(--text); outline-offset: 2px; }
.hub-lifter .sprite { display: block; }
.hub-lifter.hub-flex .sprite { animation: hub-hop .5s steps(5, end); }
.hub-shadow { left: 44px; bottom: 34px; width: 176px; height: 14px; z-index: 5; background: rgba(11, 4, 20, .5); border-radius: 50%; }
.hub-tag { left: 28px; width: 208px; bottom: 10px; z-index: 7; text-align: center; }
.hub-tag .nametag { font-size: 12px; padding: 3px 10px; box-shadow: 3px 3px 0 var(--ink); }
.hub-noart { display: none; }
.hub-scene.hub-broken .hub-noart { display: flex; left: 52px; bottom: 48px; width: 156px; height: 230px; z-index: 6; align-items: center; justify-content: center; text-align: center; background: var(--ink); border: 3px dashed var(--muted); color: var(--muted); font-size: 11px; font-weight: 700; padding: var(--s2); }
.hub-scene.hub-broken .hub-lifter .sprite { visibility: hidden; }

/* speech bubble */
.hub-bubble { right: var(--s4); top: 70px; z-index: 9; width: 150px; padding: 8px 10px; background: var(--text); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--hub-cls); font-family: var(--display); font-size: 17px; letter-spacing: .5px; line-height: 1.05; text-transform: uppercase; animation: px-pop .2s steps(3, end) both; }
.hub-bubble::after { content: ""; position: absolute; left: -15px; bottom: 10px; width: 12px; height: 12px; background: var(--text); border: 3px solid var(--ink); border-right: 0; border-top: 0; clip-path: polygon(0 100%, 100% 0, 100% 100%); }
.hub-bubble[hidden] { display: none; }

/* the area's action object, standing next to the lifter as a hint of how sets are logged */
.hub-obj { right: 34px; bottom: 44px; z-index: 4; }
.hub-obj > * { position: absolute; }

/* HUD strip under the world: level, title, XP */
.hub-hud { flex: none; padding: var(--s3) var(--s4) var(--s4); background: var(--surface); border-bottom: 4px solid var(--ink); display: grid; grid-template-columns: auto 1fr; column-gap: var(--s3); row-gap: var(--s2); align-items: center; }
.hub-lv { grid-row: 1; display: flex; align-items: baseline; gap: 4px; background: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--pink); padding: 4px 8px 2px; }
.hub-lv small { font-family: var(--body); font-weight: 700; font-size: 11px; color: var(--muted); }
.hub-lv b { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; color: var(--text); }
.hub-lvtext { min-width: 0; }
.hub-lvtext b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1; letter-spacing: 1px; text-transform: uppercase; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hub-lvtext span { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.hub-lvtext span em { font-style: normal; color: var(--lime); }
.hub-hud .xpbar { grid-column: 1 / -1; height: 20px; }

/* body under the HUD */
.hub-body { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }

/* next workout */
.hub-quest { --shadow-c: var(--hub-cls); padding: 0; }
.hub-qhead { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4) 0; }
.hub-qhead .kicker { color: var(--hub-cls); }
.hub-qhead .hub-run { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--ink); background: var(--hub-cls); padding: 2px 6px; animation: px-blink 1s steps(1, end) infinite; }
.hub-ex { list-style: none; margin: 0; padding: var(--s2) var(--s4) var(--s3); display: flex; flex-direction: column; gap: 6px; }
.hub-ex li { display: flex; align-items: center; gap: var(--s3); font-family: var(--display); font-size: 25px; line-height: 1.05; letter-spacing: 1px; text-transform: uppercase; }
.hub-ex li::before { content: ""; flex: none; width: 10px; height: 10px; background: var(--hub-cls); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.hub-ex li.hub-done { color: var(--muted); }
.hub-ex li.hub-done::before { background: var(--lime); }
.hub-ex .hub-got { margin-left: auto; font-family: var(--body); font-weight: 700; font-size: 11px; letter-spacing: 1px; color: var(--ink); background: var(--muted); padding: 1px 6px; }
.hub-rule { display: flex; align-items: center; gap: var(--s2); margin: 0; padding: var(--s2) var(--s4); background: var(--ink); color: var(--hub-acc); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.hub-rule i { flex: none; width: 14px; height: 14px; background: var(--hub-acc); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--hub-acc-lo); }

.hub-ex.many li { font-size: 19px; }
/* this week: streak days, embers, bounties */
.hub-week { --shadow-c: var(--orange); padding: 0; }
.hub-week .hub-qhead .kicker { color: var(--orange); }
.hub-embers { display: flex; gap: 2px; }
.hub-embers i { display: block; width: 18px; height: 18px; color: var(--raised); }
.hub-embers i.on { color: var(--orange); }
.hub-embers svg { display: block; width: 100%; height: 100%; }
.hub-days { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); }
.hub-days b { color: var(--text); }
.hub-days em { font-style: normal; color: var(--orange); }
.hub-dots { display: flex; gap: 3px; flex: none; }
.hub-dots i { width: 12px; height: 12px; background: var(--raised); border: 2px solid var(--ink); }
.hub-dots i.on { background: var(--orange); }
.hub-bounties { list-style: none; margin: 0; padding: 0 var(--s4) var(--s3); display: flex; flex-direction: column; gap: 4px; }
.hub-bounties li { display: flex; align-items: center; gap: var(--s2); font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--text); }
.hub-bounties li > span:nth-child(2) { flex: 1; }
.hub-bounties b { color: var(--lime); }
.hub-bounties li.done { color: var(--muted); text-decoration: line-through 2px var(--line); }
.hub-bcheck { flex: none; width: 16px; height: 16px; border: 2px solid var(--orange); color: var(--lime); }
.hub-bcheck svg { display: block; width: 100%; height: 100%; }
.hub-run.still { animation: none !important; }
/* last session line */
.hub-last { display: flex; align-items: center; gap: var(--s2); margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.hub-last svg { width: 16px; height: 16px; flex: none; color: var(--orange); }
.hub-last b { color: var(--text); }

/* footer: the CTA, then the nav bar */
.hub-foot { padding-bottom: var(--s3); border-top: 4px solid var(--ink); }
.hub-cta svg { width: 24px; height: 24px; }
.hub-cta .hub-clock { font-family: var(--display); font-size: 20px; color: var(--lime); background: var(--ink); padding: 2px 8px; min-width: 76px; text-align: center; }
.hub-cta.hub-cont { font-size: 22px; }
.hub-nav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--ink); border-top: 3px solid var(--line); }
.hub-nav button { appearance: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: transparent; border: 0; border-right: 3px solid var(--surface); color: var(--muted); font-family: var(--body); font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
.hub-nav button:last-child { border-right: 0; }
.hub-nav button svg { width: 20px; height: 20px; }
.hub-nav button:active { color: var(--text); background: var(--surface); }
.hub-nav button:focus-visible { outline: 3px dashed var(--text); outline-offset: -5px; }
.hub-nav button[aria-current="page"] { color: var(--text); background: var(--raised); box-shadow: inset 0 4px 0 var(--pink); cursor: default; }

/* ---------- area art (simplified scenes from the Starting areas board) ---------- */
.hub-sun { border: 3px solid var(--ink); border-bottom: 0; border-radius: 80px 80px 0 0; background: repeating-linear-gradient(0deg, #ffa033 0 8px, #1f0d36 8px 12px); }
.hub-mesa { background: #3b2230; border: 3px solid var(--ink); border-bottom: 0; clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); box-shadow: inset 6px 0 0 #6b4a5e; }
.hub-pole { width: 7px; background: #4b2d19; border: 2px solid var(--ink); }
.hub-cactus { width: 22px; background: #3a2a52; border: 3px solid var(--ink); border-radius: 11px 11px 0 0; }
.hub-eyes { width: 4px; height: 4px; background: #ffa033; box-shadow: 7px 0 0 #ffa033; animation: hub-blinkeye 3s steps(1, end) infinite; }
.hub-barrel { left: 0; bottom: 0; width: 46px; height: 62px; border: 3px solid var(--ink); border-radius: 5px; background: repeating-linear-gradient(45deg, #ffa033 0 7px, #0b0414 7px 14px); box-shadow: inset 0 6px 0 #a6643c, inset 0 -6px 0 #a6643c; }
.hub-moon { width: 46px; height: 46px; border-radius: 50%; background: #f6eeff; border: 3px solid var(--ink); box-shadow: inset -8px -6px 0 #c9b8e8; }
.hub-sea { left: 0; right: 0; bottom: 86px; height: 70px; background: #2a1148; border-top: 3px solid var(--ink); }
.hub-foam { left: 0; right: 0; bottom: 86px; height: 6px; background: repeating-linear-gradient(90deg, #f6eeff 0 14px, transparent 14px 30px); }
.hub-palm { width: 10px; background: #6b5033; border: 2px solid var(--ink); }
.hub-chest { left: 0; bottom: 0; width: 60px; height: 44px; background: #a6643c; border: 3px solid var(--ink); box-shadow: inset 0 -8px 0 #6b3d22; }
.hub-chest::before { content: ""; position: absolute; left: -3px; right: -3px; top: -20px; height: 20px; background: #ffa033; border: 3px solid var(--ink); border-bottom: 0; }
.hub-chest::after { content: ""; position: absolute; left: 24px; top: -6px; width: 10px; height: 12px; background: #ff5fb0; border: 2px solid var(--ink); }
.hub-bricks { left: 0; right: 0; top: 0; bottom: 86px; background:
  repeating-linear-gradient(0deg, #2a1d40 0 3px, transparent 3px 26px),
  repeating-linear-gradient(90deg, #2a1d40 0 3px, transparent 3px 48px); }
.hub-window { width: 72px; height: 104px; background: #12061f; border: 4px solid var(--ink); border-radius: 36px 36px 0 0; box-shadow: inset 0 0 0 5px #5a4778; }
.hub-banner { width: 40px; height: 82px; background: #ff5fb0; border: 3px solid var(--ink); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); box-shadow: inset 6px 0 0 #ff98c2; }
.hub-torch { width: 8px; height: 24px; background: #6b5033; border: 2px solid var(--ink); }
.hub-flame { width: 14px; height: 16px; background: #ffa033; border: 2px solid var(--ink); box-shadow: inset 0 -5px 0 #ffc075; animation: hub-flick .6s steps(2, end) infinite; transform-origin: bottom; }
.hub-wall { left: 0; bottom: 0; width: 70px; height: 70px; background: #8672a5; border: 3px solid var(--ink); box-shadow: inset 6px 6px 0 #a996c6, inset -6px -6px 0 #5a4778; }
.hub-wall::before { content: ""; position: absolute; left: 16px; top: 14px; width: 6px; height: 36px; background: #f6eeff; box-shadow: 10px 0 0 #f6eeff, 20px 0 0 #f6eeff; }
.hub-deck { left: 0; right: 0; top: 74px; height: 34px; background: #3a2a52; border-top: 4px solid var(--ink); border-bottom: 4px solid var(--ink); background-image: radial-gradient(#12061f 3px, transparent 3.5px); background-size: 24px 34px; background-position: 6px 0; }
.hub-dots { inset: 112px 0 86px 0; background: radial-gradient(rgba(255, 95, 176, .22) 2px, transparent 2.5px) 0 0 / 20px 20px; }
.hub-graf { font-family: var(--display); font-size: 34px; letter-spacing: 2px; line-height: 1; transform: rotate(-6deg); text-shadow: 3px 3px 0 var(--ink); }
.hub-neon { font-family: var(--display); font-size: 13px; letter-spacing: 1px; padding: 2px 6px; border: 3px solid var(--lime); color: var(--lime); background: var(--ink); animation: hub-neon 3s steps(1, end) infinite; }
.hub-road { left: 0; right: 0; bottom: 30px; height: 6px; background: repeating-linear-gradient(90deg, #c6ff3d 0 26px, transparent 26px 52px); opacity: .7; }
.hub-punch { left: 0; bottom: 0; width: 50px; height: 92px; background: #3a2a52; border: 3px solid var(--ink); box-shadow: inset 6px 0 0 #5a4778; }
.hub-punch::before { content: ""; position: absolute; left: 6px; right: 6px; top: 8px; height: 16px; background: var(--ink); border: 2px solid var(--lime); }
.hub-punch::after { content: ""; position: absolute; left: -14px; top: 34px; width: 26px; height: 26px; background: #ff5fb0; border: 3px solid var(--ink); box-shadow: inset 4px 4px 0 #ff98c2; }
.hub-aurora { height: 14px; border: 2px solid var(--ink); opacity: .75; transform: rotate(-4deg); }
.hub-peak { background: #3a2a52; border: 3px solid var(--ink); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.hub-cap { background: #f6eeff; clip-path: polygon(50% 0, 72% 44%, 60% 38%, 50% 50%, 40% 38%, 28% 44%); }
.hub-pine { width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent; border-bottom: 70px solid #2a1148; }
.hub-ice { left: 0; bottom: 0; width: 56px; height: 50px; border: 3px solid var(--ink); background: #88dff3; box-shadow: inset 8px 8px 0 #c9f2ff, inset -8px -8px 0 #3681b2; }
.hub-snow { inset: 0; background-image: radial-gradient(#f6eeff 1.5px, transparent 2px); background-size: 37px 41px; animation: hub-snow 2s steps(4, end) infinite; opacity: .7; }

@keyframes hub-hop { 0% { transform: none; } 30% { transform: translateY(-20px); } 60% { transform: translateY(-8px) scaleX(1.04); } 100% { transform: none; } }
@keyframes hub-twinkle { 50% { opacity: .55; } }
@keyframes hub-blinkeye { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@keyframes hub-flick { 50% { transform: scaleY(.8) translateX(1px); } }
@keyframes hub-neon { 0%, 86%, 100% { opacity: 1; } 88% { opacity: .25; } 92% { opacity: .5; } }
@keyframes hub-snow { to { background-position: 0 41px; } }
</style>
</head>
<body class="px">
<main class="phone" data-screen="hub">
  <section class="screen hub-screen" aria-label="Hub">
    <div class="hub-scene" id="scene">
      <div class="hub-art" id="art" aria-hidden="true"></div>
      <div class="hub-obj" id="obj" aria-hidden="true"></div>
      <span class="hub-mark" aria-hidden="true">PUMPLEX<sup>TM</sup></span>
      <span class="hub-where" id="where"></span>
      <button class="icon-btn hub-menu" type="button" id="menuBtn" aria-label="Menu"></button>
      <span class="hub-shadow" aria-hidden="true"></span>
      <button class="hub-lifter" type="button" id="lifter" aria-label="Your lifter. Tap to flex."><span class="bob" id="sprite"></span></button>
      <span class="hub-noart" aria-hidden="true">LIFTER STILL IN THE CHANGING ROOM</span>
      <span class="hub-tag"><span class="nametag" id="clsTag"></span></span>
      <p class="hub-bubble" id="bubble" role="status" hidden></p>
    </div>

    <div class="hub-hud">
      <div class="hub-lv" id="lv"><small>LV</small><b id="lvNum">1</b></div>
      <div class="hub-lvtext"><b id="lvTitle"></b><span id="lvMsg"></span></div>
      <div class="xpbar" role="progressbar" aria-label="XP to the next level" aria-valuemin="0" aria-valuemax="100" id="xpbar"><i></i></div>
    </div>

    <div class="hub-body">
      <section class="panel hub-quest" aria-labelledby="questKicker">
        <div class="hub-qhead"><p class="kicker" id="questKicker">NEXT WORKOUT</p><span class="hub-run" id="runTag" hidden>IN PROGRESS</span></div>
        <ul class="hub-ex" id="exList"></ul>
        <p class="hub-rule" id="rule"><i aria-hidden="true"></i><span></span></p>
      </section>
      <section class="panel hub-week" aria-labelledby="weekKicker">
        <div class="hub-qhead"><p class="kicker" id="weekKicker">THIS WEEK</p><span class="hub-embers" id="embers"></span></div>
        <div class="hub-days" id="days"></div>
        <ul class="hub-bounties" id="bounties"></ul>
      </section>
      <p class="hub-last" id="last"></p>
    </div>
  </section>

  <footer class="foot hub-foot">
    <button class="btn cta hub-cta" type="button" id="cta"></button>
  </footer>
  <nav class="hub-nav" aria-label="Main">
    <button type="button" id="navHistory"></button>
    <button type="button" aria-current="page" id="navHub"></button>
    <button type="button" id="navProfile"></button>
  </nav>
</main>
<script>
(function () {
  "use strict";
  if (!PX.require(["setupDone"], "character")) return;

  var s = PX.get();
  var cls = PX.cls() || PX.CLASSES.scrapper;
  var area = PX.area() || PX.area(cls.area) || PX.AREAS.rustbelt;
  var $ = function (id) { return document.getElementById(id); };
  var phone = document.querySelector(".phone");

  /* ---------- colours ---------- */
  phone.style.setProperty("--hub-cls", PX.c(cls.color));
  phone.style.setProperty("--hub-acc", PX.c(area.color));
  phone.style.setProperty("--hub-acc-lo", PX.c(area.color, "lo"));
  var scene = $("scene");
  scene.style.setProperty("--hub-sky", area.sky);
  scene.style.setProperty("--hub-floor", area.floor);

  /* ---------- the world: one simplified scene per area ---------- */
  var ART = {
    rustbelt:
      '<div style="left:216px;bottom:86px;width:132px;height:66px" class="hub-sun"></div>' +
      '<div style="left:-12px;bottom:86px;width:170px;height:80px" class="hub-mesa"></div>' +
      '<div style="left:0;right:0;bottom:86px;height:8px;background:#ecd7d0;border-top:2px solid #0b0414"></div>' +
      '<div style="left:166px;top:90px;height:150px" class="hub-pole"></div>' +
      '<div style="left:146px;top:104px;width:48px;height:6px;background:#4b2d19;border:2px solid #0b0414"></div>' +
      '<div style="right:118px;bottom:86px;height:64px" class="hub-cactus"></div>' +
      '<div style="right:122px;bottom:120px" class="hub-eyes"></div>' +
      '<div class="hub-floor"></div>' +
      '<div style="right:10px;bottom:10px;width:110px;height:26px;border-top:2px solid #6b3d22;border-left:2px solid #6b3d22;transform:skewX(40deg)"></div>',
    riptide:
      '<div class="hub-stars"></div>' +
      '<div style="right:40px;top:76px" class="hub-moon"></div>' +
      '<div class="hub-sea"></div>' +
      '<div style="right:60px;bottom:110px;width:8px;height:30px;background:#f6eeff;opacity:.35"></div>' +
      '<div style="left:150px;bottom:150px;width:70px;height:10px;background:#12061f;border:2px solid #0b0414"></div>' +
      '<div style="left:180px;bottom:158px;height:46px" class="hub-palm"></div>' +
      '<div style="left:160px;bottom:200px;width:52px;height:12px;background:#3a2a52;border:2px solid #0b0414;transform:rotate(-14deg)"></div>' +
      '<div class="hub-floor"></div><div class="hub-foam"></div>' +
      '<div style="right:150px;bottom:16px;width:18px;height:18px;background:#ff5fb0;border:2px solid #0b0414;clip-path:polygon(50% 0,63% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,37% 35%)"></div>',
    gainsgard:
      '<div class="hub-bricks"></div>' +
      '<div style="left:186px;top:78px" class="hub-window"></div>' +
      '<div style="left:196px;top:182px;width:52px;height:50px;background:rgba(246,238,255,.12);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)"></div>' +
      '<div style="right:24px;top:64px" class="hub-banner"></div>' +
      '<div style="left:150px;top:132px" class="hub-torch"></div>' +
      '<div style="left:147px;top:114px" class="hub-flame"></div>' +
      '<div class="hub-floor" style="background-image:repeating-linear-gradient(90deg,transparent 0 56px,#5a4778 56px 59px)"></div>' +
      '<div style="left:40px;bottom:12px;width:190px;height:16px;background:#ff5fb0;border:3px solid #0b0414;box-shadow:inset 0 4px 0 #ff98c2"></div>',
    arcade:
      '<div class="hub-deck"></div><div class="hub-dots"></div>' +
      '<div style="left:174px;top:126px;color:#ff5fb0" class="hub-graf">GAINZ</div>' +
      '<div style="right:24px;top:122px" class="hub-neon">OPEN 24/7</div>' +
      '<div style="left:250px;bottom:86px;width:40px;height:60px;background:#c8a9f3;border:3px solid #0b0414;transform:rotate(3deg);box-shadow:inset 0 -14px 0 #a77bff"></div>' +
      '<div class="hub-floor"></div><div class="hub-road"></div>' +
      '<div style="right:140px;bottom:6px;width:70px;height:10px;background:#c6ff3d;opacity:.35"></div>',
    frostbite:
      '<div class="hub-stars"></div>' +
      '<div style="left:150px;top:70px;width:240px;background:#c6ff3d" class="hub-aurora"></div>' +
      '<div style="left:120px;top:94px;width:280px;background:#3fd2ff" class="hub-aurora"></div>' +
      '<div style="left:170px;bottom:86px;width:200px;height:140px" class="hub-peak"></div>' +
      '<div style="left:170px;bottom:86px;width:200px;height:140px" class="hub-cap"></div>' +
      '<div style="right:12px;bottom:86px" class="hub-pine"></div>' +
      '<div class="hub-floor"></div><div class="hub-snow"></div>' +
      '<div style="right:150px;bottom:14px;width:10px;height:6px;background:#a996c6;box-shadow:22px -8px 0 #a996c6,44px 0 0 #a996c6,66px -8px 0 #a996c6"></div>'
  };
  var OBJ = {
    rustbelt: '<span class="hub-barrel"></span>',
    riptide: '<span class="hub-chest"></span>',
    gainsgard: '<span class="hub-wall"></span>',
    arcade: '<span class="hub-punch"></span>',
    frostbite: '<span class="hub-ice"></span>'
  };
  var OBJ_W = { rustbelt: 46, riptide: 60, gainsgard: 70, arcade: 50, frostbite: 56 };
  var OBJ_H = { rustbelt: 62, riptide: 64, gainsgard: 70, arcade: 92, frostbite: 50 };
  /* how a set is logged here, as one short line (moodboard "Starting areas") */
  var RULE = {
    rustbelt: "1 SET = 1 BARREL BLOWN UP",
    riptide: "1 SET = 1 SHELL FROM THE CHEST",
    gainsgard: "1 SET = 1 SCRATCH ON THE WALL",
    arcade: "1 SET = 1 PUNCH ON THE PUNCH-O-TRON",
    frostbite: "1 SET = 1 ICE BLOCK SMASHED"
  };
  $("art").innerHTML = ART[area.id] || ART.rustbelt;
  var obj = $("obj");
  obj.innerHTML = OBJ[area.id] || OBJ.rustbelt;
  obj.style.width = (OBJ_W[area.id] || 46) + "px";
  obj.style.height = (OBJ_H[area.id] || 62) + "px";
  $("where").textContent = area.name;

  /* ---------- the lifter ---------- */
  /* 3x keeps the head clear of the logo and the speech bubble, even on the widest bodies */
  var spr = PX.sprite($("sprite"), s.character, 3);
  spr.removeAttribute("role"); spr.removeAttribute("aria-label"); /* the button carries the label */
  var probe = new Image();
  probe.onerror = function () { scene.classList.add("hub-broken"); };
  probe.src = "../moodboard/creator/body_atlas.png";

  var tag = $("clsTag");
  tag.textContent = cls.name;
  tag.style.setProperty("--tag-c", PX.c(cls.color));
  $("lifter").setAttribute("aria-label", "Your lifter, a " + cls.name + ". Tap to flex.");

  /* ---------- level and XP ---------- */
  var G = PX.game();
  var L = G.level;
  $("lvNum").textContent = L.level;
  $("lvTitle").textContent = L.title;
  $("lvMsg").innerHTML = "<em>" + L.toNext + " XP</em> TO LEVEL " + (L.level + 1);
  var bar = $("xpbar");
  bar.style.setProperty("--pct", L.pct + "%");
  bar.setAttribute("aria-valuenow", L.pct);
  bar.setAttribute("aria-valuetext", L.toNext + " XP to level " + (L.level + 1));

  /* ---------- next workout: names only ---------- */
  var cur = s.current && s.current.date === PX.today() ? s.current : null;
  var todays = PX.sessionByDate(PX.today());
  /* the app picks it (brief rule 4): today's session if there is one, else a fresh plan */
  var list = PX.live(cur ? cur.exercises : todays ? todays.exercises : PX.planWorkout());
  $("exList").innerHTML = "";
  list.forEach(function (ex) {
    var li = document.createElement("li");
    li.textContent = PX.exercise(ex.exerciseId).name;
    var got = ex.sets || 0;
    if (got) {
      if (got >= ex.targetSets) li.className = "hub-done";
      var g = document.createElement("span");
      g.className = "hub-got"; g.textContent = got + (got === 1 ? " SET" : " SETS");
      li.appendChild(g);
    }
    $("exList").appendChild(li);
  });
  $("rule").querySelector("span").textContent = RULE[area.id] || RULE.rustbelt;
  if (cur) {
    $("questKicker").textContent = "CURRENT WORKOUT";
    $("runTag").hidden = false;
  } else if (todays) {
    $("questKicker").textContent = "TODAY'S SESSION";
    $("runTag").textContent = "DONE"; $("runTag").hidden = false; $("runTag").classList.add("still");
  }
  if (list.length > 4) $("exList").classList.add("many");
  /* ---------- this week: streak, embers, bounties (rules.md §3, §5) ---------- */
  var S = G.streak;
  var days = $("days"), dh = "";
  for (var d = 0; d < Math.max(S.N, S.thisWeek); d++) dh += '<i class="' + (d < S.thisWeek ? "on" : "") + '"></i>';
  days.innerHTML = '<span class="hub-dots">' + dh + "</span><span><b>" + S.thisWeek + " OF " + S.N + "</b> TRAINING DAYS" +
    (S.thisWeek >= S.N ? " · STREAK SAFE" : "") + (S.weeks ? " · <em>" + S.weeks + "-WEEK STREAK</em>" : "") + "</span>";
  days.setAttribute("aria-label", S.thisWeek + " of " + S.N + " training days this week. Streak " + S.weeks + " weeks. Missing days inside a week never break it.");
  var em = "";
  for (var e = 0; e < PX.RULES.emberMax; e++) em += '<i class="' + (e < S.embers ? "on" : "") + '">' + PX.icon("ember") + "</i>";
  $("embers").innerHTML = em;
  $("embers").setAttribute("role", "img");
  $("embers").setAttribute("aria-label", S.embers + " of 3 embers. An ember keeps the streak alive when a week falls short.");
  $("embers").title = "Embers: a week that falls short uses one, and the streak lives on";
  $("bounties").innerHTML = G.bounties.map(function (b) {
    return '<li class="' + (b.done ? "done" : "") + '"><span class="hub-bcheck" aria-hidden="true">' + (b.done ? PX.icon("check") : "") + "</span>" +
      "<span>" + b.text.toUpperCase() + (b.need > 1 && !b.done ? " · " + b.got + "/" + b.need : "") + "</span><b>+" + b.xp + "</b></li>";
  }).join("");

  /* ---------- last session / empty state ---------- */
  var sessions = (s.sessions || []).filter(function (x) { return !x.legacy; });
  var last = $("last");
  if (!sessions.length) {
    last.innerHTML = PX.icon("bolt") + "<span><b>YOUR FIRST QUEST AWAITS.</b> NO PRESSURE. (SOME PRESSURE.)</span>";
  } else {
    var ls = sessions[sessions.length - 1];
    var ago = Math.floor((startOfDay(Date.now()) - startOfDay(ls.start)) / 864e5);
    var when = ago <= 0 ? "TODAY" : ago === 1 ? "YESTERDAY" : ago + " DAYS AGO";
    var n = PX.sessionSets(ls);
    var tail = ago > 10 ? " · WELCOME BACK, NO HARD FEELINGS" : ""; /* rest never punishes (rules.md) */
    last.innerHTML = PX.icon("flame") + "<span>LAST SESSION: <b>" + when + "</b> · " + n + (n === 1 ? " SET" : " SETS") + tail + "</span>";
  }
  function startOfDay(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }

  /* ---------- CTA ---------- */
  var cta = $("cta");
  var tick = null;
  if (cur) {
    cta.classList.add("hub-cont");
    cta.innerHTML = PX.icon("play") + '<span>CONTINUE TRAINING</span><span class="hub-clock" id="clock"></span>';
    var paint = function () { $("clock").textContent = PX.fmtClock(Date.now() - cur.start); };
    paint(); tick = setInterval(paint, 1000);
    cta.setAttribute("aria-label", "Continue training");
  } else {
    cta.innerHTML = PX.icon("play") + "<span>" + (todays ? "TRAIN MORE TODAY" : "START TRAINING") + "</span>";
  }
  cta.onclick = function () { PX.startWorkout(); PX.go("workout"); };

  /* ---------- navigation ---------- */
  $("menuBtn").innerHTML = PX.icon("menu");
  $("menuBtn").onclick = function () { PX.go("menu"); };
  $("navHistory").innerHTML = PX.icon("history") + "<span>HISTORY</span>";
  $("navHub").innerHTML = PX.icon("bolt") + "<span>HUB</span>";
  $("navProfile").innerHTML = PX.icon("user") + "<span>PROFILE</span>";
  $("navHistory").onclick = function () { PX.go("history"); };
  $("navProfile").onclick = function () { PX.go("profile"); };

  /* ---------- tap the lifter: hop, flex, talk ---------- */
  var LINES = [
    "I FLEX, THEREFORE I AM.",
    "THE GREEN BUTTON. PRESS IT. I DARE YOU.",
    "MY MUSCLES HAVE MUSCLES. ALLEGEDLY.",
    "STOP POKING. START LIFTING.",
    "ONE MORE SET. THEN ONE MORE.",
    "I WARMED UP. FOR YOU.",
    "THE FLOOR CALLED. IT WANTS PUSH-UPS.",
    "SWEAT IS JUST FAT CRYING."
  ];
  if (!sessions.length) LINES.unshift("FIRST QUEST? I WAS BORN READY. LIKE, LITERALLY. JUST NOW.");
  if (cur) LINES.unshift("THE CLOCK IS RUNNING. SO SHOULD WE.");
  var bubble = $("bubble"), lifter = $("lifter"), lineI = 0, hideT = null;
  function say(text, ms) {
    bubble.hidden = true; void bubble.offsetWidth;
    bubble.textContent = text; bubble.hidden = false;
    clearTimeout(hideT); hideT = setTimeout(function () { bubble.hidden = true; }, ms || 2600);
  }
  lifter.onclick = function () {
    lifter.classList.remove("hub-flex"); void lifter.offsetWidth; lifter.classList.add("hub-flex");
    say(LINES[lineI % LINES.length]);
    lineI = lineI === 0 ? 1 + Math.floor(Math.random() * (LINES.length - 1)) : (lineI + 1 + Math.floor(Math.random() * 2)) % LINES.length || 1;
  };
  lifter.addEventListener("animationend", function () { lifter.classList.remove("hub-flex"); });

  /* the lifter greets you once on arrival */
  setTimeout(function () {
    say(cur ? "THE CLOCK IS RUNNING. SO SHOULD WE." : !sessions.length ? "FIRST QUEST? I WAS BORN READY." : "BACK FOR MORE? GOOD.", 2400);
  }, 350);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Reward</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<style>
/* ---------- Reward (09): loot drop after I WORKED. Screen-only styles, prefix .rw- ---------- */
.rw-top .kicker b { color: var(--text); }
.rw-screen { display: flex; flex-direction: column; gap: var(--s4); padding-top: var(--s3); cursor: pointer; }

/* hero: the frozen scene with the stencil slam */
.rw-hero {
  position: relative; height: 236px; flex: none; overflow: hidden;
  background: var(--rw-sky, var(--surface));
  border: var(--border-thick); box-shadow: 6px 6px 0 var(--rw-c, var(--pink));
}
.rw-hero::before { /* far skyline blocks in the area colour */
  content: ""; position: absolute; left: 0; right: 0; bottom: 34px; height: 70px;
  background:
    linear-gradient(var(--rw-c-lo) 0 0) 6% 100% / 40px 46px no-repeat,
    linear-gradient(var(--rw-c-lo) 0 0) 20% 100% / 24px 70px no-repeat,
    linear-gradient(var(--rw-c-lo) 0 0) 78% 100% / 52px 38px no-repeat,
    linear-gradient(var(--rw-c-lo) 0 0) 95% 100% / 28px 60px no-repeat;
  opacity: .55;
}
.rw-hero::after { /* the ground */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px;
  background: var(--rw-floor, var(--raised)); border-top: 4px solid var(--ink);
}
.rw-burst {
  position: absolute; right: -36px; top: 18px; width: 230px; height: 230px; z-index: 1;
  background: var(--rw-c, var(--pink)); opacity: .9;
}
.rw-lifter {
  position: absolute; right: -34px; bottom: 22px; z-index: 2;
  width: 240px; height: 216px; image-rendering: pixelated;
  background-repeat: no-repeat; background-size: 240px 216px;
}
.rw-hero .rw-stripes {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(-55deg, rgba(11, 4, 20, .62) 0 12px, rgba(11, 4, 20, .30) 12px 24px);
}
.rw-hero.frozen .rw-lifter { filter: grayscale(1) contrast(1.6); }
.rw-hero.frozen .rw-burst { opacity: .35; }
.rw-hero:not(.frozen) .rw-stripes { opacity: 0; }
.rw-slam {
  position: absolute; left: 14px; top: 20px; z-index: 4;
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2);
}
.rw-slam .slam-tag { font-size: 44px; line-height: .92; box-shadow: 6px 6px 0 var(--pink); }
.rw-slam .slam-sub { margin-left: 10px; }

/* XP: counter, bonus badge, bar */
.rw-xp { position: relative; padding-bottom: var(--s4); }
.rw-xp-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s3); }
.rw-xp-num {
  font-family: var(--display); font-size: 64px; line-height: .9; letter-spacing: 1px; color: var(--text);
  text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 var(--violet-lo); white-space: nowrap;
}
.rw-xp-num small { font-size: 32px; margin-left: 4px; color: var(--muted); text-shadow: 2px 2px 0 var(--ink); }
.rw-xp-num.tick { animation: rw-tick .07s steps(1, end); }
@keyframes rw-tick { 0% { transform: translateY(-3px); } }
.rw-bonus {
  flex: none; max-width: 150px; text-align: center;
  font-family: var(--display); font-size: 16px; line-height: 1.05; letter-spacing: 1px; text-transform: uppercase;
  color: var(--ink); background: var(--rw-dc, var(--orange));
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 6px 8px 4px; transform: rotate(4deg);
}
.rw-bonus b { display: block; font-size: 26px; font-weight: 400; }
.rw-bonus.in { animation: rw-stamp .28s steps(4, end) both; }
@keyframes rw-stamp { 0% { transform: rotate(4deg) scale(1.9); opacity: 0; } 100% { transform: rotate(4deg) scale(1); opacity: 1; } }

.rw-lv { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); margin: var(--s4) 0 var(--s2); }
.rw-lv .display { font-size: 20px; }
.rw-lv .display em { font-style: normal; color: var(--muted); font-size: 14px; margin-left: 6px; letter-spacing: 1px; }
.rw-lv .kicker { white-space: nowrap; }
.rw-bar { height: 26px; box-shadow: 0 0 0 2px var(--line), 4px 4px 0 2px var(--ink); }
.rw-bar > i { transition: width .6s steps(8, end); }
.rw-bar.flash > i { background: repeating-linear-gradient(90deg, var(--text) 0 10px, var(--muted) 10px 12px); }
.rw-bar.snap > i { transition: none; }
.rw-bar-note { margin: var(--s2) 0 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.rw-bar-note b { color: var(--text); }

/* loot lines */
.rw-loot { display: flex; flex-direction: column; gap: var(--s2); }
.rw-loot-head { display: flex; align-items: center; gap: var(--s2); }
.rw-loot-head::after { content: ""; flex: 1; height: 3px; background: var(--line); }
.rw-item {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  min-height: 52px; padding: var(--s2) var(--s3);
  background: var(--ink); border: 3px solid var(--tier-c); box-shadow: 4px 4px 0 var(--tier-c);
}
.rw-item.drop { animation: rw-drop .24s steps(4, end) both; }
@keyframes rw-drop { 0% { transform: translateY(-28px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.rw-item-name { min-width: 0; }
.rw-item-name b { display: block; font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; line-height: 1.05; }
.rw-item-name small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--tier-c); }
.rw-marks { display: flex; gap: 6px; flex: none; }
.rw-marks span { display: flex; gap: 2px; }
.rw-marks i { width: 18px; height: 18px; color: var(--x-c, var(--muted)); }
.rw-marks i svg { display: block; width: 100%; height: 100%; }
.rw-marks i.off { opacity: .35; }
.rw-item.skip { --tier-c: var(--line); }
.rw-item.skip .rw-item-name b { color: var(--muted); text-decoration: line-through 3px var(--line); }

.rw-stats { display: flex; gap: var(--s2); flex-wrap: wrap; }
.rw-stat {
  display: flex; align-items: center; gap: var(--s2);
  background: var(--surface); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--line);
  padding: 6px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
}
.rw-stat b { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--text); letter-spacing: 1px; }
.rw-stat svg { width: 18px; height: 18px; color: var(--rw-c, var(--orange)); }
.rw-quip {
  align-self: flex-start; margin: 0 0 var(--s2) 6px;
  font-family: var(--display); font-size: 22px; line-height: 1.05; letter-spacing: 1px; text-transform: uppercase;
  color: var(--ink); background: var(--rw-c, var(--pink)); padding: 6px 12px 4px;
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); transform: rotate(-2deg);
}

/* hidden until its beat in the sequence */
.rw-hide { visibility: hidden; }
.rw-in { animation: px-pop .2s steps(3, end) both; }
.rw-skip-hint {
  position: absolute; right: var(--s4); top: 64px; z-index: 30;
  font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); background: var(--ink); padding: 2px 6px;
  animation: px-blink 1s steps(1, end) infinite;
}

/* level-up freeze card */
.rw-lvl { gap: var(--s2); padding: var(--s5); }
.rw-lvl .rw-lvl-kick {
  font-family: var(--display); font-size: 22px; letter-spacing: 2px; color: var(--text);
  text-shadow: 2px 2px 0 var(--pink); animation: px-pop .2s steps(3, end) both; position: relative; z-index: 3;
}
.rw-lvl-stage { position: relative; width: 300px; height: 230px; display: flex; align-items: flex-end; justify-content: center; }
.rw-lvl-stage .starburst { position: absolute; inset: 0; margin: auto; width: 290px; height: 290px; top: -40px; background: var(--rw-lc, var(--violet)); }
.rw-lvl-stage .rw-lifter { position: relative; right: auto; bottom: 0; }
.rw-lvl.frozen .rw-lifter { filter: grayscale(1) contrast(1.6); }
.rw-lvl.frozen .starburst { background: var(--ink); outline: 0; }
.rw-lvl .slam-tag { font-size: 64px; padding: 8px 18px 4px; margin-top: calc(-1 * var(--s6)); position: relative; z-index: 2; box-shadow: 6px 6px 0 var(--pink); }
.rw-lvl .slam-sub { font-size: 15px; position: relative; z-index: 2; }
.rw-lvl .rw-lvl-hint { margin-top: var(--s4); font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); }
.rw-lvl:not(.slammed) .slam-tag, .rw-lvl:not(.slammed) .slam-sub { visibility: hidden; animation: none; }

/* empty state */
.rw-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--s4); cursor: default; }
.rw-chest { position: relative; width: 168px; height: 128px; }
.rw-chest i { position: absolute; display: block; border: 4px solid var(--ink); }
.rw-chest .lid { left: 8px; right: 8px; top: 0; height: 44px; background: var(--raised); box-shadow: inset 0 -8px 0 var(--violet-lo); }
.rw-chest .box { left: 0; right: 0; top: 40px; bottom: 0; background: var(--surface); box-shadow: inset 0 8px 0 var(--violet-lo), 6px 6px 0 var(--line); }
.rw-chest .lock { left: 70px; top: 30px; width: 28px; height: 32px; background: var(--muted); z-index: 1; }
.rw-chest .web { left: 112px; top: -14px; width: 3px; height: 34px; border: 0; background: var(--muted); }
.rw-empty .title { font-size: 44px; }
.rw-empty .sub { max-width: 280px; }
</style>
</head>
<body class="px">
<main class="phone" data-screen="reward">
  <header class="topbar rw-top">
    <p class="kicker" id="rwKicker">LOOT DROP</p>
    <span class="nametag" id="rwTag" hidden></span>
  </header>
  <section class="screen rw-screen" id="rwScreen" aria-live="polite"></section>
  <footer class="foot" id="rwFoot"></footer>
</main>
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; };
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var st = PX.get();

  /* ---------- test hooks: ?test=levelup | ?test=plain fabricate a reward from the latest session (memory only) ---------- */
  var tm = /[?&]test=(levelup|plain)\b/.exec(location.search);
  if (tm && st.sessions.length) {
    var last = st.sessions[st.sessions.length - 1];
    var before = st.xp - last.xp;
    var lvB = PX.levelInfo(before).level, lvA = PX.levelInfo(st.xp).level;
    if (tm[1] === "levelup" && lvA === lvB) { st.xp = PX.xpToReach(lvA + 1) + Math.round(last.xp / 3); }
    if (tm[1] === "plain" && lvA !== lvB) { st.xp = PX.xpToReach(lvA) + last.xp + 40; }
    st.lastReward = { sessionId: last.id, xp: last.xp,
      levelBefore: PX.levelInfo(st.xp - last.xp).level, levelAfter: PX.levelInfo(st.xp).level };
  }

  var screen = $("#rwScreen"), foot = $("#rwFoot");
  var R = st.lastReward;

  /* ---------- empty / error state ---------- */
  if (!R || !(R.xp >= 0)) {
    $("#rwKicker").textContent = "LOOT DROP · EMPTY";
    screen.classList.add("rw-empty");
    screen.innerHTML =
      '<div class="rw-chest" aria-hidden="true"><i class="lid"></i><i class="box"></i><i class="lock"></i><i class="web"></i></div>' +
      '<h1 class="title">NOTHING TO<br>CLAIM YET</h1>' +
      '<p class="sub">The loot chest only opens after a workout. Lift something, press I WORKED, come back rich.</p>';
    foot.innerHTML = '<button class="btn cta" type="button" id="rwHub">GO EARN SOME</button>';
    $("#rwHub").onclick = function () { PX.go("hub"); };
    return;
  }

  /* ---------- data ---------- */
  var sIdx = -1;
  st.sessions.forEach(function (s, i) { if (s.id === R.sessionId) sIdx = i; });
  var sess = sIdx >= 0 ? st.sessions[sIdx] : null;
  var klass = PX.cls(sess && sess.cls) || PX.cls() || PX.CLASSES.scrapper;
  var ar = PX.area(sess && sess.area) || PX.area() || PX.AREAS.rustbelt;
  var diff = PX.difficulty() || PX.DIFFICULTIES[0];
  var after = PX.levelInfo(st.xp), beforeXp = Math.max(0, st.xp - R.xp), before = PX.levelInfo(beforeXp);
  var levelUp = R.levelAfter > R.levelBefore;
  var newInfo = PX.levelInfo(PX.xpToReach(R.levelAfter));
  var LADDER = ["muted", "lime", "sky", "violet", "orange"];
  var TIERS = ["COMMON", "UNCOMMON", "RARE", "EPIC", "LEGENDARY"];
  var rung = function (i) { return Math.min(Math.max(i, 0), LADDER.length - 1); };

  /* the animated body closest to the player's character (6 bodies: fat = muscle = 0 / 50 / 100) */
  var ch = st.character || { sex: "male", fat: 50, muscle: 50 };
  var avg = ((ch.fat || 0) + (ch.muscle || 0)) / 2, lvlBody = avg < 25 ? 0 : avg < 75 ? 50 : 100;
  var BODY = "../moodboard/animation/" + (ch.sex === "female" ? "female" : "male") + "_fat" + lvlBody + "_muscle" + lvlBody + "/";
  var FLEX = [["0_dip", 120], ["1_air2", 90], ["2_air4", 120], ["1_air2", 90], ["3_land", 90], ["4_hold", 700], ["5_rest", 400]];
  var IDLE = [["0_rest", 420], ["1_out", 300], ["1_out", 260], ["0_rest", 300]];
  FLEX.concat(IDLE).forEach(function (f, i) { var im = new Image(); im.src = BODY + (i < FLEX.length ? "pr_flex_" : "idle_") + f[0] + ".png"; });
  function play(el, anim, prefix, opts) {
    opts = opts || {};
    var i = 0, t = null;
    function show() {
      var f = anim[i];
      el.style.backgroundImage = 'url("' + BODY + prefix + f[0] + '.png")';
      if (opts.stopAt === i) { if (opts.onStop) opts.onStop(); return; }
      t = setTimeout(function () { i = (i + 1) % anim.length; show(); }, f[1]);
    }
    if (reduce) { i = opts.stopAt != null ? opts.stopAt : 0; el.style.backgroundImage = 'url("' + BODY + prefix + anim[i][0] + '.png")'; if (opts.onStop) opts.onStop(); return { stop: function () {} }; }
    show();
    return { stop: function () { clearTimeout(t); } };
  }

  /* pixel X mark, same style as the set records */
  var X = '<svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M0 0h3v1h1v1h1v1h2V2h1V1h1V0h3v3h-1v1h-1v1H9v2h1v1h1v1h1v3H9v-1H8v-1H7v-1H5v1H4v1H3v1H0V9h1V8h1V7h1V5H2V4H1V3H0z"/><path fill="#0b0414" d="M0 3h1v1H0zm3 9v-1h1v1zm6 0v-1h1v1zm3-3h-1V8h1z" opacity=".5"/></svg>';
  var CLOCK = PX.icon("history"), FLAME = PX.icon("flame");

  var QUIPS = [
    "THE SOFA HAS BEEN NOTIFIED OF YOUR ABSENCE.",
    "YOUR MUSCLES FILED A COMPLAINT. DENIED.",
    "HYDRATE. GLOAT. REPEAT.",
    "SOMEWHERE A DUMBBELL JUST FLINCHED.",
    "THAT WAS RUDE TO GRAVITY. DO IT AGAIN.",
    "LOOT SECURED. SWEAT NOT REFUNDABLE."
  ];
  var quip = QUIPS[(sIdx >= 0 ? sIdx : 0) % QUIPS.length];
  if (levelUp) quip = "NEW LEVEL. SAME SWEATY YOU.";

  /* ---------- top bar ---------- */
  $("#rwKicker").innerHTML = "LOOT DROP · <b>SESSION " + (sIdx >= 0 ? sIdx + 1 : "?") + "</b>";
  var tag = $("#rwTag"); tag.hidden = false; tag.textContent = klass.name; tag.style.setProperty("--tag-c", PX.c(klass.color));

  var phone = $(".phone");
  phone.style.setProperty("--rw-c", PX.c(ar.color));
  phone.style.setProperty("--rw-c-lo", PX.c(ar.color, "lo"));
  phone.style.setProperty("--rw-sky", ar.sky);
  phone.style.setProperty("--rw-floor", ar.floor);
  phone.style.setProperty("--rw-dc", PX.c(diff.color));
  phone.style.setProperty("--rw-lc", PX.c(LADDER[rung(R.levelAfter - 1)] === "muted" ? "violet" : LADDER[rung(R.levelAfter - 1)]));

  /* ---------- build the page (every beat starts hidden) ---------- */
  var clock = sess ? PX.fmtClock(sess.end - sess.start) : "--:--";
  var totalSets = sess ? PX.totalSets(sess.sets) : 0;
  var plan = sess ? PX.workout(sess.cls) : [];
  var names = sess ? Object.keys(sess.sets) : [];
  plan.forEach(function (p) { if (names.indexOf(p.name) < 0) names.push(p.name); });

  var lootHtml = names.map(function (name) {
    var n = sess.sets[name] || 0, target = 0;
    plan.forEach(function (p) { if (p.name === name) target = p.target; });
    if (!n) return '<li class="rw-item skip rw-hide"><div class="rw-item-name"><b>' + esc(name) + '</b><small>SKIPPED · IT WILL REMEMBER</small></div></li>';
    var slots = Math.max(n, target), marks = "", group = "";
    for (var j = 0; j < slots; j++) {
      group += '<i class="' + (j < n ? "" : "off") + '" style="--x-c:' + (j < n ? PX.c(LADDER[rung(j)]) : "var(--muted)") + '">' + X + "</i>";
      if ((j + 1) % 5 === 0 || j === slots - 1) { marks += "<span>" + group + "</span>"; group = ""; }
    }
    var t = rung(n - 1);
    return '<li class="rw-item rw-hide" style="--tier-c:' + PX.c(LADDER[t]) + '" aria-label="' + esc(name) + ", " + n + " working sets, " + TIERS[t].toLowerCase() + '">' +
      '<div class="rw-item-name"><b>' + esc(name) + " · " + n + " SET" + (n === 1 ? "" : "S") + "</b><small>" + TIERS[t] + (n > target && target ? " · OVERKILL" : "") + "</small></div>" +
      '<div class="rw-marks" aria-hidden="true">' + marks + "</div></li>";
  }).join("");
  if (!sess) lootHtml = '<li class="rw-item skip rw-hide"><div class="rw-item-name"><b>LOOT LOG LOST</b><small>THE XP STILL COUNTS. THE RECEIPT RAN OFF.</small></div></li>';

  screen.innerHTML =
    '<div class="rw-hero frozen" id="rwHero">' +
      '<div class="rw-burst starburst" aria-hidden="true"></div>' +
      '<div class="rw-lifter" id="rwLifter" role="img" aria-label="Your lifter"></div>' +
      '<div class="rw-stripes" aria-hidden="true"></div>' +
      '<div class="rw-slam rw-hide" id="rwSlam"><div class="slam-tag" style="--slam-c:var(--lime)">WORKOUT<br>CRUSHED</div>' +
      '<div class="slam-sub" style="--slam-c:' + PX.c(ar.color) + '">' + esc(ar.name) + " SURVIVED YOU</div></div>" +
    "</div>" +
    '<div class="rw-xp rw-hide" id="rwXp">' +
      '<div class="rw-xp-row"><div class="rw-xp-num" id="rwNum" aria-label="' + R.xp + ' XP earned">+0<small>XP</small></div>' +
      '<div class="rw-bonus rw-hide" id="rwBonus">' + esc(diff.name) + " BONUS<b>x" + diff.mult + "</b></div></div>" +
      '<div class="rw-lv"><span class="display" id="rwLvName">LV ' + before.level + "<em>" + esc(before.title) + "</em></span>" +
      '<span class="kicker" id="rwLvNext">NEXT: LV ' + (before.level + 1) + "</span></div>" +
      '<div class="xpbar rw-bar" id="rwBar" style="--pct:' + before.pct + '%" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + before.pct + '"><i></i></div>' +
      '<p class="rw-bar-note rw-hide" id="rwNote"></p>' +
    "</div>" +
    '<div class="rw-loot">' +
      '<p class="kicker rw-loot-head rw-hide" id="rwLootHead">LOOT · ' + totalSets + " WORKING SET" + (totalSets === 1 ? "" : "S") + "</p>" +
      '<ul class="rw-loot" style="list-style:none;margin:0;padding:0" id="rwList">' + lootHtml + "</ul>" +
    "</div>" +
    '<div class="rw-stats rw-hide" id="rwStats">' +
      '<span class="rw-stat">' + CLOCK + "TIME UNDER IRON <b>" + clock + "</b></span>" +
      '<span class="rw-stat">' + FLAME + "<b>" + st.sessions.length + "</b> SESSIONS SURVIVED</span>" +
    "</div>" +
    '<p class="rw-quip rw-hide" id="rwQuip">' + quip + "</p>";

  foot.innerHTML =
    '<button class="btn cta" type="button" id="rwHub">BACK TO HUB</button>' +
    '<button class="btn ghost" type="button" id="rwHist">' + PX.icon("history").replace("<svg", '<svg width="18" height="18"') + "SEE HISTORY</button>";
  $("#rwHub").onclick = function () { PX.go("hub"); };
  $("#rwHist").onclick = function () { PX.go("history"); };

  var heroAnim = null, lifter = $("#rwLifter");
  lifter.style.backgroundImage = 'url("' + BODY + 'pr_flex_5_rest.png")';

  function reveal(el, cls) { el.classList.remove("rw-hide"); if (cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); } }
  function scrollTo(el) { var r = el.getBoundingClientRect(), s = screen.getBoundingClientRect(); if (r.bottom > s.bottom) screen.scrollTop += r.bottom - s.bottom + 16; }

  /* ---------- the sequence: hard-stepped beats, tap to jump ahead ---------- */
  var timers = [];
  function later(fn, ms) { var t = setTimeout(fn, reduce ? 0 : ms); timers.push(t); return t; }
  function clearAll() { timers.forEach(clearTimeout); timers = []; }

  var num = $("#rwNum"), bar = $("#rwBar"), note = $("#rwNote");
  function setNum(v) { num.firstChild.nodeValue = "+" + v; }
  function setBar(pct) { bar.style.setProperty("--pct", pct + "%"); bar.setAttribute("aria-valuenow", pct); }
  function setLevelLabel(info) {
    $("#rwLvName").innerHTML = "LV " + info.level + "<em>" + esc(info.title) + "</em>";
    $("#rwLvNext").textContent = "NEXT: LV " + (info.level + 1);
  }
  function finalNote() {
    note.innerHTML = "<b>" + after.toNext + " XP</b> TO " + esc(PX.levelInfo(PX.xpToReach(after.level + 1)).title);
  }

  var beats = [
    { /* 0: freeze + slam */
      run: function (next) { reveal($("#rwSlam")); later(next, 900); },
      skip: function () { reveal($("#rwSlam")); }
    },
    { /* 1: XP counter ticks up in hard steps, then the bonus stamps */
      run: function (next) {
        reveal($("#rwXp"), "rw-in");
        var steps = 10, k = 0;
        (function tick() {
          k++; setNum(Math.round(R.xp * k / steps));
          num.classList.remove("tick"); void num.offsetWidth; num.classList.add("tick");
          if (k < steps) later(tick, 70); else later(function () { reveal($("#rwBonus"), "in"); later(next, 500); }, 120);
        })();
      },
      skip: function () { reveal($("#rwXp")); setNum(R.xp); reveal($("#rwBonus")); }
    },
    { /* 2: bar fills toward the next level */
      run: function (next) {
        if (levelUp) {
          setBar(100);
          later(function () { bar.classList.add("flash"); note.innerHTML = "<b>BAR FULL.</b> SOMETHING IS HAPPENING."; reveal(note, "rw-in"); later(next, 450); }, 650);
        } else {
          setBar(after.pct); later(function () { finalNote(); reveal(note, "rw-in"); later(next, 400); }, 650);
        }
      },
      skip: function () {
        if (levelUp) { bar.classList.add("snap", "flash"); setBar(100); }
        else { bar.classList.add("snap"); setBar(after.pct); finalNote(); reveal(note); }
      }
    }
  ];
  if (levelUp) beats.push({ /* 3: LEVEL UP freeze card with the lifter flexing */
    run: function (next) { levelCard(next); },
    skip: function () { closeCard(); }
  });
  beats.push({ /* 4: loot drops line by line */
    run: function (next) {
      if (levelUp) { bar.classList.remove("flash"); bar.classList.add("snap"); setBar(0); setLevelLabel(after); void bar.offsetWidth; bar.classList.remove("snap"); setBar(after.pct); finalNote(); reveal(note); }
      var head = $("#rwLootHead"); reveal(head, "rw-in");
      var items = [].slice.call(document.querySelectorAll(".rw-item"));
      var parts = items.concat([$("#rwStats"), $("#rwQuip")]);
      parts.forEach(function (el, i) { later(function () { reveal(el, el.classList.contains("rw-item") ? "drop" : "rw-in"); scrollTo(el); if (i === parts.length - 1) next(); }, 200 + i * 220); });
    },
    skip: function () {
      if (levelUp) { bar.classList.remove("flash"); bar.classList.add("snap"); setLevelLabel(after); setBar(after.pct); finalNote(); reveal(note); }
      [].slice.call(document.querySelectorAll(".rw-hide")).forEach(function (el) { el.classList.remove("rw-hide"); });
    }
  });

  var cur = -1, hint = null;
  function next() {
    cur++;
    if (cur >= beats.length) { finishAll(); return; }
    beats[cur].run(next);
  }
  function finishAll() {
    if (hint) { hint.remove(); hint = null; }
    $("#rwHero").classList.remove("frozen");
    if (heroAnim) heroAnim.stop();
    heroAnim = levelUp ? play(lifter, FLEX, "pr_flex_") : play(lifter, IDLE, "idle_");
  }
  function skipAhead() {
    if (cur < 0 || cur >= beats.length) return;
    clearAll();
    beats[cur].skip();
    next();
  }

  /* level-up card: the lifter flexes, freezes on the hold pose, then the level slams in */
  var card = null, cardAnim = null, cardNext = null;
  function levelCard(done) {
    cardNext = done;
    card = document.createElement("div");
    card.className = "freeze rw-lvl";
    card.setAttribute("role", "dialog");
    card.setAttribute("aria-label", "Level up: level " + R.levelAfter + ", " + newInfo.title);
    card.innerHTML =
      '<div class="rw-lvl-kick">LEVEL UP</div>' +
      '<div class="rw-lvl-stage"><div class="starburst" aria-hidden="true"></div><div class="rw-lifter" role="img" aria-label="Your lifter flexing"></div></div>' +
      '<div class="slam-tag" style="--slam-c:var(--rw-lc)">LEVEL ' + R.levelAfter + "</div>" +
      '<div class="slam-sub" style="--slam-c:var(--rw-lc)">NEW TITLE: ' + esc(newInfo.title) + "</div>" +
      '<div class="rw-lvl-hint">TAP TO CLAIM</div>';
    phone.appendChild(card);
    var lf = $(".rw-lifter", card);
    cardAnim = play(lf, FLEX, "pr_flex_", { stopAt: 5, onStop: function () {
      card.classList.add("frozen", "slammed");
      later(function () { card.classList.remove("frozen"); cardAnim = play(lf, FLEX, "pr_flex_"); }, 1100);
    } });
    card.addEventListener("click", function (e) { e.stopPropagation(); skipAhead(); });
    timers.push(setTimeout(function () { closeCard(); next(); }, 3600));
  }
  function closeCard() { if (cardAnim) cardAnim.stop(); if (card) { card.remove(); card = null; } }

  screen.addEventListener("click", skipAhead);
  if (!reduce) {
    hint = document.createElement("div"); hint.className = "rw-skip-hint"; hint.textContent = "TAP TO SKIP";
    phone.appendChild(hint);
  }
  next();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Past sessions</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<script>
  /* Guard: no history before the setup is done. */
  if (!PX.get().setupDone) PX.go("character", { replace: true });
</script>
<style>
/* ---------- 10 history: screen-only styles (.his-) ---------- */
.his-top { padding-bottom: var(--s2); }
.his-top .kicker { flex: 1; text-align: right; }
.his-head { padding: 0 0 var(--s4); margin-bottom: var(--s4); border-bottom: 3px dashed var(--line); }
.his-head .title { font-size: 38px; }
.his-sum {
  display: inline-block; margin-top: var(--s3);
  font-family: var(--display); font-size: 17px; letter-spacing: 1px; line-height: 1; text-transform: uppercase;
  background: var(--ink); color: var(--text); border: 2px solid var(--pink); padding: 6px 10px 5px;
  transform: rotate(-2deg); transform-origin: left;
}
.his-sum b { font-weight: 400; color: var(--pink-hi); }
.his-head .sub { margin-top: var(--s2); }

.his-list { padding-bottom: var(--s4); }
.his-group { display: flex; align-items: center; gap: var(--s2); margin: var(--s5) 0 var(--s3); }
.his-group:first-child { margin-top: 0; }
.his-group span {
  font-family: var(--display); font-size: 18px; letter-spacing: 1px; line-height: 1;
  background: var(--violet); color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 4px 10px 3px; transform: rotate(-3deg);
}
.his-group i { flex: 1; height: 3px; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 12px); }
.his-group small { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); }

/* one session = one quest-log card */
.his-card {
  position: relative; margin-bottom: var(--s4);
  background: var(--surface); border: var(--border-thick);
  box-shadow: 5px 5px 0 var(--line);
  padding-left: 8px;
}
.his-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--area-c); border-right: 3px solid var(--ink); }
.his-card[data-open="true"] { box-shadow: 5px 5px 0 var(--area-c); }
.his-tog {
  appearance: none; width: 100%; display: block; text-align: left; cursor: pointer;
  background: none; border: 0; padding: var(--s3) var(--s3) var(--s3) var(--s3); min-height: 44px; color: var(--text);
}
.his-tog:focus-visible { outline: 3px dashed var(--text); outline-offset: -6px; }
.his-tog:active .his-date { transform: translate(2px, 2px); }
.his-row1 { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); }
.his-no { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
.his-date { display: block; font-family: var(--display); font-size: 26px; letter-spacing: 1px; line-height: 1; margin-top: 2px; }
.his-xp {
  flex: none; font-family: var(--display); font-size: 22px; line-height: 1; letter-spacing: 1px;
  color: var(--ink); background: var(--pink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 5px 8px 3px; transform: rotate(4deg); margin: 2px 4px 0 0;
}
.his-xp small { font-size: 13px; }
.his-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-top: var(--s2); }
.his-took {
  display: inline-flex; align-items: center; gap: 5px;
  font-weight: 700; font-size: 12px; background: var(--ink); border: 2px solid var(--line); padding: 1px 7px;
}
.his-took svg { width: 14px; height: 14px; color: var(--muted); }
.his-area { --tag-c: var(--area-c); }
.his-chev { margin-left: auto; width: 20px; height: 20px; color: var(--muted); transition: transform 60ms steps(1); }
.his-card[data-open="true"] .his-chev { transform: rotate(180deg); }

/* compact strip of all marks when closed */
.his-strip { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px; margin-top: var(--s3); min-height: 24px; }
.his-card[data-open="true"] .his-strip { display: none; }
.his-sgrp { display: inline-flex; align-items: flex-end; gap: 3px; padding-right: 10px; margin-right: 6px; border-right: 2px dashed var(--line); }
.his-sgrp:last-child { border-right: 0; }

/* details */
.his-body { display: none; padding: 0 var(--s3) var(--s3); }
.his-card[data-open="true"] .his-body { display: block; animation: px-pop .16s steps(2, end) both; transform-origin: top; }
.his-ex {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  min-height: 44px; padding: var(--s2) var(--s2) var(--s2) var(--s3);
  background: var(--area-floor, var(--raised)); border: 3px solid var(--ink);
}
.his-ex + .his-ex { margin-top: 4px; }
.his-ex b { font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; line-height: 1; color: var(--ink); }
.his-ex b small { display: block; font-family: var(--body); font-weight: 700; font-size: 10px; letter-spacing: 1px; margin-top: 3px; color: var(--ink); opacity: .75; }
.his-ex .his-marks { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end; gap: 3px; max-width: 62%; }
.his-ex.zero b { opacity: .6; }
.his-none { font-size: 11px; font-weight: 700; color: var(--ink); opacity: .7; }
.his-foot {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: var(--s3);
  font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase;
}
.his-stamp {
  font-family: var(--display); font-size: 16px; letter-spacing: 1px; line-height: 1; text-transform: uppercase;
  color: var(--stamp-c); border: 3px solid var(--stamp-c); padding: 4px 8px 2px; transform: rotate(-5deg);
}

/* ---------- area marks (moodboard "Starting areas") ---------- */
/* Rustbelt: spray-painted X tags in rarity colours */
.his-m-x { font-family: var(--display); font-size: 22px; line-height: .9; transform: rotate(-8deg); text-shadow: 2px 2px 0 var(--ink); }
/* Gainsgard: tally marks, 4 strokes then a slash */
.his-m-tally { position: relative; display: inline-flex; gap: 3px; height: 22px; padding: 0 2px; margin-right: 4px; }
.his-m-tally i { width: 4px; height: 22px; background: var(--text); box-shadow: 1px 0 0 var(--ink); }
.his-m-tally em { position: absolute; left: -4px; top: 9px; width: 30px; height: 4px; background: var(--text); box-shadow: 0 1px 0 var(--ink); transform: rotate(-28deg); }
/* Riptide: shells, every 5th a pearl */
.his-m-shell { width: 16px; height: 12px; border: 2px solid var(--ink); border-radius: 50% 50% 3px 3px; background: repeating-linear-gradient(90deg, var(--pink) 0 3px, var(--pink-hi) 3px 5px); box-shadow: inset 0 -3px 0 var(--pink-lo); }
.his-m-pearl { width: 13px; height: 13px; border: 2px solid var(--ink); border-radius: 50%; background: var(--sky-hi); box-shadow: inset -3px -3px 0 var(--sky-lo), inset 2px 2px 0 var(--text); }
/* Arcade: tickets */
.his-m-ticket { width: 12px; height: 10px; background: var(--orange-hi); border: 2px solid var(--ink); box-shadow: inset 0 -2px 0 var(--orange); }
.his-m-ticket:nth-child(5n) { background: var(--lime); box-shadow: inset 0 -2px 0 var(--lime-lo); }
/* Frostbite: little summit flags in rarity colours */
.his-m-flag { position: relative; width: 14px; height: 20px; }
.his-m-flag i { position: absolute; left: 0; bottom: 0; width: 3px; height: 20px; background: var(--text); border: 1px solid var(--ink); }
.his-m-flag b { position: absolute; left: 3px; top: 0; width: 11px; height: 8px; border: 2px solid var(--ink); }
.his-more { font-size: 11px; font-weight: 700; color: var(--ink); background: var(--text); padding: 0 4px; align-self: center; }
.his-strip .his-more { background: var(--ink); color: var(--text); }

/* ---------- empty state ---------- */
.his-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: var(--s2); }
.his-e-stage { position: relative; width: 100%; height: 340px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.his-e-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--violet-lo); border-top: 3px solid var(--ink); }
.his-e-floor::after { content: ""; position: absolute; inset: 14px 0 auto; height: 3px; background: repeating-linear-gradient(90deg, var(--ink) 0 20px, transparent 20px 44px); opacity: .5; }
.his-e-guy { position: relative; z-index: 2; margin-bottom: 26px; display: flex; flex-direction: column; align-items: center; }
.his-e-guy .ground-shadow { width: 120px; margin-top: -8px; }
.his-e-say {
  position: absolute; z-index: 3; top: 14px; left: 16px; right: 16px;
  background: var(--text); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--pink);
  font-weight: 700; font-size: 13px; line-height: 1.35; padding: var(--s2) var(--s3); text-align: left;
}
.his-e-say::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 14px; height: 14px; background: var(--text); border: 3px solid var(--ink); border-top: 0; border-left: 0; transform: translateX(-50%) rotate(45deg); }
.his-empty .title { margin-top: var(--s5); }
.his-ghost {
  width: 100%; margin-top: var(--s5); padding: var(--s3) var(--s4); text-align: left;
  border: 3px dashed var(--line); display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
}
.his-ghost span { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
.his-ghost span b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--text); margin-top: 2px; }
.his-ghost .his-m-x { font-size: 30px; color: transparent; -webkit-text-stroke: 2px var(--muted); text-shadow: none; opacity: .7; }
.his-ghost div { display: flex; gap: 6px; }
</style>
</head>
<body class="px">
<main class="phone" data-screen="history">
  <header class="topbar his-top">
    <button class="icon-btn" type="button" id="his-back" aria-label="Back to the hub"></button>
    <p class="kicker">QUEST LOG</p>
  </header>
  <section class="screen">
    <div class="his-head" id="his-head" hidden>
      <h1 class="title">YOUR LEGEND SO FAR</h1>
      <div class="his-sum" id="his-sum"></div>
      <p class="sub" id="his-quip"></p>
    </div>
    <div id="his-screen"></div>
  </section>
  <footer class="foot"><button class="btn cta" type="button" id="his-cta">BACK TO HUB</button></footer>
</main>
<script>
(function () {
  "use strict";
  var s = PX.get();
  if (!s.setupDone) return;

  var q = location.search;
  var sessions = /[?&]test=empty\b/.test(q) ? [] : (s.sessions || []).slice();
  /* ?test=areas: show each card in a different area so every mark style is visible (display only, not saved). */
  if (/[?&]test=areas\b/.test(q)) sessions = sessions.map(function (x, i) {
    var y = {}; for (var k in x) y[k] = x[k]; y.areaId = PX.AREA_ORDER[i % PX.AREA_ORDER.length]; return y;
  });
  sessions.sort(function (a, b) { return b.start - a.start; });

  var LADDER = ["muted", "lime", "sky", "violet", "orange", "pink"];
  function rung(i) { return "var(--" + LADDER[Math.min(i, LADDER.length - 1)] + ")"; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  document.getElementById("his-back").innerHTML = PX.icon("back");
  document.getElementById("his-back").onclick = function () { PX.go("hub"); };
  document.getElementById("his-cta").onclick = function () { PX.go("hub"); };

  var screen = document.getElementById("his-screen");

  /* ---------- empty state ---------- */
  if (!sessions.length) {
    document.getElementById("his-cta").textContent = "START TRAINING";
    screen.innerHTML =
      '<div class="his-empty">' +
        '<div class="his-e-stage stage">' +
          '<p class="his-e-say">This quest log is emptier than my protein tub. Go make some history, legend.</p>' +
          '<div class="his-e-floor" aria-hidden="true"></div>' +
          '<div class="his-e-guy"><div id="his-e-sprite" class="bob"></div><div class="ground-shadow"></div></div>' +
        '</div>' +
        '<h1 class="title">NO LEGENDS YET</h1>' +
        '<p class="sub">Every workout you finish lands here, marks and all. Right now it is just you and the dust.</p>' +
        '<div class="his-ghost" aria-hidden="true"><span>SESSION 1<b>YOUR FIRST WIN</b></span>' +
          '<div><span class="his-m-x">X</span><span class="his-m-x">X</span><span class="his-m-x">X</span></div></div>' +
      '</div>';
    PX.sprite(document.getElementById("his-e-sprite"), s.character, 3);
    return;
  }

  /* ---------- summary: short messages, not a stat table ---------- */
  var G = PX.game();
  var totalMin = 0, totalSets = 0;
  sessions.forEach(function (x) { totalMin += x.minutes || 0; totalSets += PX.sessionSets(x); });
  var effort = PX.fmtMinutes(totalMin);
  var legacyN = sessions.filter(function (x) { return x.legacy; }).length, total = sessions.length - legacyN;
  document.getElementById("his-head").hidden = false;
  document.getElementById("his-sum").innerHTML =
    "<b>" + total + "</b> SESSION" + (total === 1 ? "" : "S") + (legacyN ? " + " + legacyN + " FROM THE OLD APP" : "") + " · <b>" + effort + "</b> OF PURE EFFORT";
  var quips = [
    totalSets + " working sets. Zero spreadsheets.",
    totalSets + " sets logged. The barrels have filed a complaint.",
    totalSets + " sets in the bank. Your future self says thanks."
  ];
  document.getElementById("his-quip").textContent = quips[sessions.length % quips.length];

  /* ---------- marks: drawn the way the session's area draws them ---------- */
  var CAP = 12;
  function marks(areaId, n) {
    var shown = Math.min(n, CAP), out = "", i;
    if (areaId === "gainsgard") {
      for (i = 0; i < shown; i += 5) {
        var g = Math.min(5, shown - i), st = "";
        for (var j = 0; j < Math.min(4, g); j++) st += "<i></i>";
        out += '<span class="his-m-tally">' + st + (g === 5 ? "<em></em>" : "") + "</span>";
      }
    } else {
      for (i = 0; i < shown; i++) {
        if (areaId === "riptide") out += '<span class="' + (i % 5 === 4 ? "his-m-pearl" : "his-m-shell") + '"></span>';
        else if (areaId === "arcade") out += '<span class="his-m-ticket"></span>';
        else if (areaId === "frostbite") out += '<span class="his-m-flag"><i></i><b style="background:' + rung(i) + '"></b></span>';
        else out += '<span class="his-m-x" style="color:' + rung(i) + '">X</span>';
      }
    }
    if (n > CAP) out += '<span class="his-more">+' + (n - CAP) + "</span>";
    return out;
  }

  function verdict(done, target) {
    if (done > target) return { t: "OVERACHIEVER", c: "var(--pink)" };
    if (done === target) return { t: "CRUSHED IT", c: "var(--lime)" };
    if (done >= target * 0.6) return { t: "SOLID WORK", c: "var(--sky)" };
    return { t: "SHOWED UP. COUNTS.", c: "var(--orange)" };
  }

  function startTime(ts) { var d = new Date(ts); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

  /* ---------- groups: THIS WEEK (since Monday) / EARLIER ---------- */
  var now = new Date(), monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7)).getTime();
  var html = "", lastGroup = null, total = sessions.filter(function (x) { return !x.legacy; }).length, seen = 0;
  var groupCounts = { week: 0, earlier: 0 };
  sessions.forEach(function (x) { groupCounts[x.start >= monday ? "week" : "earlier"]++; });

  sessions.forEach(function (x, idx) {
    var grp = x.start >= monday ? "week" : "earlier";
    if (grp !== lastGroup) {
      var n = groupCounts[grp];
      html += '<div class="his-group"><span>' + (grp === "week" ? "THIS WEEK" : "EARLIER") + "</span><i></i><small>" +
        n + " SESSION" + (n === 1 ? "" : "S") + "</small></div>";
      lastGroup = grp;
    }
    var ar = PX.area(x.areaId) || PX.area("rustbelt");
    var xpRow = G.byDate[x.date] || { total: 0 };
    if (x.legacy) {
      /* brief 4.7: old sessions are kept and turned into XP */
      html += '<article class="his-card his-legacy" data-open="false" style="--area-c:var(--muted);--area-floor:#3a2a52"><div class="his-tog">' +
        '<span class="his-row1"><span><span class="his-no">OLD APP</span><span class="his-date">' + PX.fmtDate(x.date) + "</span></span>" +
        '<span class="his-xp">+' + xpRow.total + " <small>XP</small></span></span>" +
        '<span class="his-meta"><span class="his-took">FROM BEFORE THE GAME · KEPT AS XP</span></span></div></article>';
      return;
    }
    seen++;
    var exs = PX.live(x.exercises), target = 0;
    exs.forEach(function (e) { target += e.targetSets; });
    var done = PX.sessionSets(x), v = verdict(done, target);
    var took = PX.fmtMinutes(x.minutes || 0);
    var number = total - seen + 1, open = seen === 1, bodyId = "his-b-" + esc(x.date);
    var strip = "", rows = "";
    exs.forEach(function (e) {
      var name = PX.exercise(e.exerciseId).name, n = e.sets || 0;
      if (n) strip += '<span class="his-sgrp">' + marks(ar.id, n) + "</span>";
      rows += '<div class="his-ex' + (n ? "" : " zero") + '"><b>' + esc(name) +
        "<small>" + (n ? n + " SET" + (n === 1 ? "" : "S") : "SKIPPED") + "</small></b>" +
        '<span class="his-marks" aria-hidden="true">' + (n ? marks(ar.id, n) : '<span class="his-none">NOTHING HERE</span>') + "</span></div>";
    });

    html +=
      '<article class="his-card" data-open="' + open + '" style="--area-c:' + PX.c(ar.color) + ";--area-floor:" + ar.floor + '">' +
        '<button class="his-tog" type="button" aria-expanded="' + open + '" aria-controls="' + bodyId + '">' +
          '<span class="his-row1"><span><span class="his-no">SESSION ' + number + '</span>' +
            '<span class="his-date">' + PX.fmtDate(x.date) + "</span></span>" +
            '<span class="his-xp">+' + xpRow.total + " <small>XP</small></span></span>" +
          '<span class="his-meta"><span class="his-took">' + PX.icon("history") + took + "</span>" +
            '<span class="nametag his-area">' + esc(ar.name) + "</span>" +
            '<svg class="his-chev" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 8h4v3h3v3h2v-3h3V8h4v3h-3v3h-3v3h-4v-3H7v-3H4z"/></svg></span>' +
          '<span class="his-strip" aria-label="' + done + ' working sets">' + strip + "</span>" +
        "</button>" +
        '<div class="his-body" id="' + bodyId + '">' + rows +
          '<div class="his-foot"><span>STARTED ' + startTime(x.start) + " · " + done + " SETS</span>" +
          '<span class="his-stamp" style="--stamp-c:' + v.c + '">' + v.t + "</span></div>" +
        "</div>" +
      "</article>";
  });

  screen.innerHTML = '<div class="his-list">' + html + "</div>";
  screen.querySelectorAll(".his-tog").forEach(function (b) {
    b.addEventListener("click", function () {
      var card = b.parentNode, open = card.getAttribute("data-open") !== "true";
      card.setAttribute("data-open", open);
      b.setAttribute("aria-expanded", open);
    });
  });
})();
</script>
</body>
</html>

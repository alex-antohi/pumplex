<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Character</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<script src="shared/atlas.js"></script>
<style>
/* ---- 02 character creation: screen-only styles ---- */
.chr-screen { display: flex; flex-direction: column; gap: var(--s3); padding-top: var(--s3); }

/* ---- stage: polka-dot sky, light floor so the ink outline reads ---- */
.chr-stage {
  position: relative; flex: none; overflow: hidden;
  height: 316px;
  box-shadow: 6px 6px 0 var(--pink);
  margin: 0 6px 0 0;
}
.chr-floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 58px;
  background:
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(114, 78, 178, .55) 46px 50px),
    var(--violet-hi);
  border-top: 4px solid var(--ink);
  transition: transform .3s steps(5, end);
}
.chr-shadow { position: absolute; left: 50%; bottom: 22px; width: 150px; margin-left: -75px; height: 14px; background: rgba(11, 4, 20, .45); border-radius: 50%; }
.chr-stage.is-zoom .chr-floor { transform: translateY(70px); }
.chr-stage.is-zoom .chr-shadow, .chr-stage.is-zoom .chr-cap, .chr-stage.is-zoom .chr-pin { display: none; }

/* the rig: the lifter canvas plus the two tap zones; the camera moves this */
.chr-rig {
  position: absolute; left: 50%; bottom: 30px; z-index: 1;
  width: 208px; height: 256px; margin-left: -104px;
  transition: transform .3s steps(5, end);
}
.chr-rig canvas, .chr-rig .sprite { display: block; width: 208px; height: 256px; image-rendering: pixelated; }
.chr-rig.is-pop canvas, .chr-rig.is-pop .sprite { animation: chr-pop .24s steps(3, end); }
@keyframes chr-pop { 0% { transform: scale(1.06, .92) translateY(8px); } 50% { transform: scale(.97, 1.04) translateY(-6px); } 100% { transform: none; } }

.chr-zone {
  position: absolute; z-index: 2; appearance: none; background: transparent; border: 0; padding: 0; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chr-zone.is-head { left: 64px; top: 0; width: 80px; height: 66px; }
.chr-zone.is-body { left: 8px; top: 66px; width: 192px; height: 186px; }
.chr-zone::after { content: ""; position: absolute; inset: 0; border: 3px dashed var(--text); opacity: 0; }
.chr-zone:hover::after { opacity: .5; }
.chr-zone:focus-visible { outline: none; }
.chr-zone:focus-visible::after { opacity: 1; }
.chr-stage.is-zoom .chr-zone::after { display: none; }

/* pins that say the head and body are tappable */
.chr-pin {
  position: absolute; z-index: 3; appearance: none; cursor: pointer;
  display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 3px 8px 2px;
  background: var(--ink); color: var(--pin-c); border: 2px solid var(--pin-c); box-shadow: 3px 3px 0 var(--ink);
  font-family: var(--display); font-size: 16px; letter-spacing: 1px; text-transform: uppercase; line-height: 1;
}
.chr-pin::before { content: ""; width: 8px; height: 8px; background: var(--pin-c); animation: px-blink 1.2s steps(1, end) infinite; }
.chr-pin.is-head { --pin-c: var(--lime); left: var(--s3); top: 34px; }
.chr-pin.is-body { --pin-c: var(--sky); right: var(--s3); top: 150px; }
.chr-pin:active { transform: translate(3px, 3px); box-shadow: none; }
.chr-pin:focus-visible { outline: 3px dashed var(--text); outline-offset: 3px; }

/* back out of a close-up */
.chr-out {
  position: absolute; left: var(--s2); top: var(--s2); z-index: 4; display: none;
  min-height: 40px; font-size: 16px; padding: 0 var(--s3) 0 var(--s2); gap: 4px;
  background: var(--ink); border-color: var(--line);
}
.chr-out svg { width: 18px; height: 18px; }
.chr-stage.is-zoom .chr-out { display: flex; }
.chr-zoomtag { position: absolute; right: var(--s2); top: var(--s2); z-index: 4; display: none; --tag-c: var(--lime); }
.chr-stage.is-zoom .chr-zoomtag { display: inline-block; }

/* the build caption: a stencil tag on the floor */
.chr-cap {
  position: absolute; left: 50%; bottom: 8px; z-index: 3; margin: 0;
  transform: translateX(-50%) rotate(-3deg);
  max-width: calc(100% - 24px);
  padding: 5px 12px 3px;
  background: var(--ink); color: var(--pink);
  border: 3px solid var(--pink); box-shadow: 4px 4px 0 var(--ink);
  font-family: var(--display); font-size: 20px; line-height: 1.05; letter-spacing: 1px; text-transform: uppercase;
  text-align: center; white-space: nowrap;
}
.chr-cap.is-stamp { animation: chr-stamp .28s steps(4, end); }
@keyframes chr-stamp { 0% { transform: translateX(-50%) rotate(-3deg) scale(1.5); opacity: 0; } 100% { transform: translateX(-50%) rotate(-3deg) scale(1); opacity: 1; } }

/* loading / error states for the atlas */
.chr-msg {
  position: absolute; left: 0; right: 0; top: 120px; z-index: 2;
  text-align: center; font-family: var(--display); font-size: 22px; letter-spacing: 1px; color: var(--muted);
  display: none; margin: 0;
}
.chr-stage.is-loading .chr-msg, .chr-stage.is-broken .chr-msg { display: block; }
.chr-stage.is-loading .chr-msg { animation: px-blink .8s steps(1, end) infinite; }
.chr-stage.is-broken .chr-msg { color: var(--orange); font-size: 18px; padding: 0 var(--s5); }
.chr-stage.is-loading .chr-rig, .chr-stage.is-broken .chr-rig, .chr-stage.is-loading .chr-pin, .chr-stage.is-broken .chr-pin { visibility: hidden; }

/* ---- panels under the stage: one per camera (full / head / body) ---- */
.chr-panel { display: flex; flex-direction: column; gap: var(--s3); }
.chr-panel[hidden] { display: none; }
.chr-panel.is-in { animation: chr-in .18s steps(3, end); }
@keyframes chr-in { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.chr-label { font-family: var(--display); font-size: 18px; letter-spacing: 1px; text-transform: uppercase; line-height: 1; margin: 0; }
.chr-row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
.chr-now { font-family: var(--display); font-size: 16px; letter-spacing: 1px; color: var(--fill, var(--lime)); line-height: 1; text-transform: uppercase; }
.chr-hint { margin: 0; font-size: 12px; color: var(--muted); }
.chr-hint b { color: var(--lime); }

.chr-sex { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-top: var(--s2); }
.chr-sex button, .chr-chip, .chr-tab {
  appearance: none; min-height: 44px; cursor: pointer;
  background: var(--surface); color: var(--muted);
  border: var(--border); box-shadow: 3px 3px 0 var(--line);
  font-family: var(--display); font-size: 18px; letter-spacing: 1px; text-transform: uppercase; line-height: 1;
  transition: transform 60ms steps(1);
}
.chr-sex button:active, .chr-chip:active, .chr-tab:active { transform: translate(3px, 3px); box-shadow: none; }
.chr-sex button[aria-pressed="true"] { background: var(--pink); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.chr-sex button:focus-visible, .chr-chip:focus-visible, .chr-sw:focus-visible, .chr-tab:focus-visible { outline: 3px dashed var(--text); outline-offset: 3px; }

.chr-chips { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
.chr-chip { flex: 1 1 auto; min-width: 64px; padding: 0 var(--s2); font-size: 16px; }
.chr-chip[aria-pressed="true"] { background: var(--lime); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }

.chr-sws { display: flex; gap: var(--s2); margin-top: var(--s2); flex-wrap: wrap; }
.chr-sw {
  appearance: none; cursor: pointer; padding: 0;
  width: 40px; height: 40px; flex: none;
  border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--line);
  background: linear-gradient(135deg, var(--a) 0 34%, var(--b) 34% 70%, var(--c) 70%);
}
.chr-sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--text), 4px 4px 0 3px var(--ink); transform: translate(-1px, -1px); }

.chr-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
.chr-tab { font-size: 18px; }
.chr-tab[aria-selected="true"] { background: var(--sky); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }

/* ---- pixel sliders ---- */
.chr-slider { --fill: var(--orange); }
.chr-slider.is-mus { --fill: var(--sky); }
.chr-track { position: relative; margin-top: var(--s1); }
.chr-ticks { position: absolute; left: 0; right: 0; top: 34px; height: 8px; pointer-events: none; }
.chr-ticks i { position: absolute; top: 0; width: 4px; height: 8px; margin-left: -2px; background: var(--line); }
.chr-ticks i.on { background: var(--fill); }
.chr-ends { display: flex; justify-content: space-between; margin-top: 2px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
.chr-ends button { appearance: none; background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; min-height: 28px; }
.chr-ends button:hover { color: var(--fill); }

.chr-range {
  -webkit-appearance: none; appearance: none;
  display: block; width: 100%; height: 44px; margin: 0;
  background: transparent; cursor: pointer;
  --f: .5;
}
.chr-range::-webkit-slider-runnable-track {
  height: 18px;
  background: linear-gradient(90deg, var(--fill) 0 calc(14px + (100% - 28px) * var(--f)), var(--raised) 0);
  border: 3px solid var(--ink);
  box-shadow: 0 0 0 2px var(--line);
}
.chr-range::-moz-range-track { height: 12px; background: var(--raised); border: 3px solid var(--ink); }
.chr-range::-moz-range-progress { height: 12px; background: var(--fill); }
.chr-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 28px; height: 36px; margin-top: -12px;
  background:
    linear-gradient(var(--ink), var(--ink)) 8px 9px / 3px 12px no-repeat,
    linear-gradient(var(--ink), var(--ink)) 14px 9px / 3px 12px no-repeat,
    var(--text);
  border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 var(--fill);
}
.chr-range::-moz-range-thumb { width: 22px; height: 30px; border-radius: 0; background: var(--text); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--fill); }
.chr-range:active::-webkit-slider-thumb { background-color: var(--fill); box-shadow: 1px 1px 0 var(--ink); }
.chr-range:focus-visible { outline: 3px dashed var(--text); outline-offset: 2px; }
</style>
</head>
<body class="px">
<main class="phone" data-screen="character">
  <header class="topbar setup-top">
    <div class="setup-t">
      <div class="setup-k"><p class="kicker" id="chr-kicker">STEP 1 OF 5</p><div class="steps" role="img" aria-label="Setup step 1 of 5"><i class="now"></i><i></i><i></i><i></i><i></i></div></div>
      <h1 class="title">Build your lifter</h1>
    </div>
  </header>

  <section class="screen chr-screen">
    <div class="stage chr-stage is-loading" id="chr-stage">
      <div class="chr-floor" aria-hidden="true"></div>
      <div class="chr-shadow" aria-hidden="true"></div>
      <p class="chr-msg" id="chr-msg" role="status">SUMMONING LIFTER...</p>
      <div class="chr-rig" id="chr-rig">
        <div id="chr-art"></div>
        <button class="chr-zone is-head" type="button" data-cam="head" aria-label="Style the head: skin, hair, facial hair"></button>
        <button class="chr-zone is-body" type="button" data-cam="body" aria-label="Style the body: clothes and colours"></button>
      </div>
      <button class="chr-pin is-head" type="button" data-cam="head" tabindex="-1" aria-hidden="true">Head</button>
      <button class="chr-pin is-body" type="button" data-cam="body" tabindex="-1" aria-hidden="true">Body</button>
      <button class="btn chr-out" type="button" id="chr-out"></button>
      <span class="nametag chr-zoomtag" id="chr-zoomtag"></span>
      <p class="chr-cap" id="chr-cap" aria-live="polite"></p>
    </div>

    <!-- full view: build -->
    <div class="chr-panel" id="chr-p-full">
      <p class="chr-hint">Tap the <b>head</b> or the <b>body</b> on your lifter to style it.</p>
      <div>
        <p class="chr-label" id="chr-sex-l">Body type</p>
        <div class="chr-sex" role="group" aria-labelledby="chr-sex-l">
          <button type="button" data-sex="male" aria-pressed="true">Male</button>
          <button type="button" data-sex="female" aria-pressed="false">Female</button>
        </div>
      </div>

      <div class="chr-slider is-fat" data-key="fat">
        <div class="chr-row">
          <label class="chr-label" for="chr-fat">Fat</label>
          <span class="chr-now" aria-hidden="true"></span>
        </div>
        <div class="chr-track">
          <input class="chr-range" id="chr-fat" type="range" min="0" max="100" step="25" value="50">
          <div class="chr-ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="chr-ends"><button type="button" data-v="0" tabindex="-1">Shredded</button><button type="button" data-v="100" tabindex="-1">Chonk</button></div>
      </div>

      <div class="chr-slider is-mus" data-key="muscle">
        <div class="chr-row">
          <label class="chr-label" for="chr-muscle">Muscle</label>
          <span class="chr-now" aria-hidden="true"></span>
        </div>
        <div class="chr-track">
          <input class="chr-range" id="chr-muscle" type="range" min="0" max="100" step="25" value="50">
          <div class="chr-ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="chr-ends"><button type="button" data-v="0" tabindex="-1">Noodle</button><button type="button" data-v="100" tabindex="-1">Hulk</button></div>
      </div>
    </div>

    <!-- head close-up: skin, hair, facial hair -->
    <div class="chr-panel" id="chr-p-head" hidden></div>

    <!-- body close-up: clothes and their colours -->
    <div class="chr-panel" id="chr-p-body" hidden>
      <div class="chr-tabs" role="tablist" aria-label="Clothes">
        <button class="chr-tab" type="button" role="tab" data-part="top" aria-selected="true">Top</button>
        <button class="chr-tab" type="button" role="tab" data-part="bottom" aria-selected="false">Bottoms</button>
        <button class="chr-tab" type="button" role="tab" data-part="shoes" aria-selected="false">Shoes</button>
      </div>
      <div id="chr-part" role="tabpanel"></div>
    </div>
  </section>

  <footer class="foot">
    <button class="btn cta" type="button" id="chr-next">This is me</button>
  </footer>
</main>

<script>
(function () {
  "use strict";
  var STOPS = {
    fat:    ["SHREDDED", "LEAN", "SOLID", "FLUFFY", "CHONK"],
    muscle: ["NOODLE", "WIRY", "FIT", "BEEFY", "HULK"]
  };
  /* build captions: [fat stop][muscle stop] */
  var BUILDS = [
    ["WALKING COAT HANGER", "WIRE-FRAME WARRIOR", "LEAN MEAN STAIR MACHINE", "HUMAN CHEESE GRATER", "ANATOMY POSTER, ALIVE"],
    ["SNACK-SIZED SPROUT", "TRAIL MIX ENJOYER", "WEEKEND WARRIOR", "BEACH SEASON THREAT", "GREEK STATUE, REMASTERED"],
    ["SOFT-SERVE STARTER", "DAD BOD, LEVEL ONE", "SOLID ALL-ROUNDER", "STRONG AND SNACKING", "BUILT LIKE A FRIDGE"],
    ["COUCH KNIGHT", "CUDDLY BRAWLER", "POWER BEAR", "TANK WITH A LUNCHBOX", "STRONGMAN IN THE MAKING"],
    ["MAXIMUM COZY", "GENTLE GIANT", "BEANBAG OF POWER", "SUMO ON A MISSION", "FINAL BOSS ENERGY"]
  ];

  /* ---------- look options: 3-step ramps (highlight, base, shadow) ---------- */
  var SKIN = [
    { id: "porcelain", name: "Porcelain", r: ["#f7dcc8", "#ecb994", "#b98068"] },
    { id: "peach",     name: "Peach",     r: ["#e4bc97", "#d39a6a", "#8c605c"] },
    { id: "tan",       name: "Tan",       r: ["#d6a274", "#b47848", "#734832"] },
    { id: "brown",     name: "Brown",     r: ["#a06c48", "#7c4c2e", "#4c2c1c"] },
    { id: "deep",      name: "Deep",      r: ["#74483a", "#523022", "#301a12"] },
    { id: "orc",       name: "Gym orc",   r: ["#c6ec86", "#8cbc4c", "#527a2c"] }
  ];
  var HAIRC = [
    { id: "brown",  name: "Brown",  r: ["#997d6b", "#5a3424", "#462533"] },
    { id: "black",  name: "Black",  r: ["#5a4a5e", "#2e2032", "#180e1a"] },
    { id: "blonde", name: "Blonde", r: ["#ffe9a0", "#e8b84a", "#9c7226"] },
    { id: "ginger", name: "Ginger", r: ["#ffb070", "#e86e2c", "#8e3c1a"] },
    { id: "pink",   name: "Pink",   r: ["#ff98c2", "#ff5fb0", "#a63e84"] },
    { id: "silver", name: "Silver", r: ["#f6eeff", "#c9b8e8", "#8672a5"] }
  ];
  var CLOTH = [
    { id: "lilac",  name: "Lilac",  r: ["#decfe5", "#c9b8e8", "#8672a5"] },
    { id: "violet", name: "Violet", r: ["#ad8ed6", "#7b4fd0", "#593597"] },
    { id: "slate",  name: "Slate",  r: ["#857788", "#3a2a52", "#33204e"] },
    { id: "pink",   name: "Pink",   r: ["#ff98c2", "#ff5fb0", "#a63e84"] },
    { id: "lime",   name: "Lime",   r: ["#dcfb7b", "#c6ff3d", "#849b42"] },
    { id: "orange", name: "Orange", r: ["#ffc075", "#ffa033", "#a6643c"] },
    { id: "sky",    name: "Sky",    r: ["#88dff3", "#3fd2ff", "#3681b2"] }
  ];
  var HAIR = [{ id: "crop", name: "Crop" }, { id: "buzz", name: "Buzz" }, { id: "mohawk", name: "Mohawk" }, { id: "afro", name: "Afro" }, { id: "long", name: "Long" }, { id: "bald", name: "Bald" }];
  var FACE = [{ id: "none", name: "None" }, { id: "stubble", name: "Stubble" }, { id: "stache", name: "Stache" }, { id: "beard", name: "Beard" }];
  var TOPS = [{ id: "tee", name: "Tee" }, { id: "crop", name: "Crop" }, { id: "sleeves", name: "Sleeves" }];
  var BOTTOMS = [{ id: "shorts", name: "Shorts" }, { id: "bike", name: "Bike" }, { id: "pants", name: "Pants" }];
  var SHOES = [{ id: "sneakers", name: "Sneakers" }, { id: "hightops", name: "High-tops" }, { id: "barefoot", name: "Barefoot" }];
  var PARTS = {
    top:    { styleKey: "top",    colorKey: "topColor",    styles: TOPS,    label: "Top",     focus: [26, 27], scale: 2.1 },
    bottom: { styleKey: "bottom", colorKey: "bottomColor", styles: BOTTOMS, label: "Bottoms", focus: [26, 43], scale: 2.1 },
    shoes:  { styleKey: "shoes",  colorKey: "shoesColor",  styles: SHOES,   label: "Shoes",   focus: [26, 55], scale: 2.4 }
  };
  var LOOK_DEFAULT = { skin: "peach", hair: "crop", hairColor: "brown", face: "none",
                       top: "tee", topColor: "lilac", bottom: "shorts", bottomColor: "violet", shoes: "sneakers", shoesColor: "slate" };
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return list[0]; }

  var s = PX.get(), saved = s.character || {};
  var ch = { sex: saved.sex === "female" ? "female" : "male", fat: PX.snap(saved.fat == null ? 50 : saved.fat), muscle: PX.snap(saved.muscle == null ? 50 : saved.muscle) };
  for (var k in LOOK_DEFAULT) ch[k] = saved[k] || LOOK_DEFAULT[k];

  var $ = function (id) { return document.getElementById(id); };
  var stage = $("chr-stage"), rig = $("chr-rig"), art = $("chr-art"), cap = $("chr-cap");
  var sexBtns = document.querySelectorAll(".chr-sex button");
  var sliders = document.querySelectorAll(".chr-slider");

  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  /* ---------- the painter: atlas frame -> pixel labels -> style edits -> colours ----------
     The atlas uses fixed ramps for skin (s), top (t), bottoms (b), shoes (f), hair (h).
     Each pixel is labelled by its ramp and step (0 highlight, 1 base, 2 shadow); styles edit
     the labels; then every label is painted with the chosen ramp. New pixels get an ink outline. */
  var ORIG = { "#e4bc97": "s0", "#d39a6a": "s1", "#8c605c": "s2", "#decfe5": "t0", "#c9b8e8": "t1", "#8672a5": "t2",
               "#ad8ed6": "b0", "#7b4fd0": "b1", "#593597": "b2", "#857788": "f0", "#3a2a52": "f1", "#33204e": "f2",
               "#997d6b": "h0", "#5a3424": "h1", "#462533": "h2", "#0b0414": "k", "#281424": "e" };
  var W = 52, H = 64, atlas = null, canvas = null, fallback = false;

  function hex(r, g, b) { return "#" + [r, g, b].map(function (v) { return v.toString(16).padStart(2, "0"); }).join(""); }

  function paint() {
    if (!atlas) return;
    if (fallback) { PX.sprite(art, ch, 4); return; }
    var ctx = canvas.getContext("2d");
    var fx = ch.fat / 25, fy = (ch.sex === "female" ? 5 : 0) + ch.muscle / 25;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(atlas, fx * W, fy * H, W, H, 0, 0, W, H);
    var img = ctx.getImageData(0, 0, W, H), d = img.data, L = new Array(W * H), x, y, i;
    for (i = 0; i < W * H; i++) {
      if (!d[i * 4 + 3]) { L[i] = null; continue; }
      var hx = hex(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]);
      L[i] = ORIG[hx] || "x" + hx;
    }
    function at(x, y) { return x < 0 || y < 0 || x >= W || y >= H ? null : L[y * W + x]; }
    function set(x, y, v) { if (x >= 0 && y >= 0 && x < W && y < H) L[y * W + x] = v; }
    function is(v, r) { return !!v && v.charAt(0) === r && v.length === 2; }
    function swapRamp(x, y, from, to) { var v = at(x, y); if (is(v, from)) set(x, y, to + v.charAt(1)); }

    /* face geometry: eyes on row 8, head outline from row 9 */
    var ex = []; for (x = 0; x < W; x++) if (at(x, 8) === "e") ex.push(x);
    var cx = ex.length ? Math.round((ex[0] + ex[ex.length - 1]) / 2) : 26;
    var hl = cx - 6; for (x = 0; x < cx; x++) if (at(x, 10) === "k" && is(at(x + 1, 10), "s")) { hl = x; break; }
    var hr = 2 * cx - hl - 2; /* last interior column of the head, mirrored from the left outline */

    /* torso skin (midriff) has top/bottoms on both sides; everything else in rows 17-41 is arm */
    function isArm(x, y) {
      if (y < 17 || y > 41 || !is(at(x, y), "s")) return false;
      var l = false, r = false, j;
      for (j = x - 1; j >= 0; j--) if (is(at(j, y), "t") || is(at(j, y), "b")) { l = true; break; }
      for (j = x + 1; j < W; j++) if (is(at(j, y), "t") || is(at(j, y), "b")) { r = true; break; }
      return !(l && r);
    }

    /* ---- hair ---- */
    if (ch.hair !== "crop" && ch.hair !== "long") {
      for (y = 0; y <= 20; y++) for (x = 0; x < W; x++) {
        var v = at(x, y);
        if (!is(v, "h")) continue;
        set(x, y, x > hl && x <= hr && y >= 3 ? "s" + v.charAt(1) : null);
      }
      /* drop outline pixels left floating outside the head */
      for (y = 0; y <= 14; y++) for (x = 0; x < W; x++) if (at(x, y) === "k" && (x < hl || x > hr + 1)) set(x, y, null);
      if (ch.hair === "buzz") for (y = 3; y <= 5; y++) for (x = hl + 1; x <= hr; x++) if (is(at(x, y), "s") && (y < 5 || (x + y) % 2)) set(x, y, "h2");
      if (ch.hair === "mohawk") for (y = 0; y <= 5; y++) { set(cx - 1, y, "h0"); set(cx, y, "h1"); }
      if (ch.hair === "afro") {
        for (y = 0; y <= 13; y++) for (x = cx - 11; x <= cx + 10; x++) {
          var dx = x - cx + .5, dy = y - 5.5, cur = at(x, y);
          if (dx * dx + dy * dy > 92) continue;
          if (y >= 6 && x > hl && x <= hr) continue;            /* keep the face */
          if (cur && !is(cur, "h") && cur !== "k" && !(is(cur, "s") && y < 6)) continue;
          set(x, y, dx + dy < -9 ? "h0" : dx + dy > 7 ? "h2" : "h1");
        }
      }
    }
    if (ch.hair === "long") {
      for (y = 4; y <= 18; y++) [hl - 2, hl - 1, hl, hr + 1, hr + 2, hr + 3].forEach(function (xx, n) {
        var cur = at(xx, y);
        if (cur === null || cur === "k" || is(cur, "h")) set(xx, y, n === 0 || n === 5 ? "h2" : "h1");
      });
    }

    /* ---- facial hair ---- */
    if (ch.face === "stubble") for (y = 11; y <= 14; y++) for (x = hl + 1; x <= hr; x++) if (is(at(x, y), "s") && (x + y) % 2 === 0) set(x, y, "h2");
    if (ch.face === "stache") {
      for (x = cx - 3; x <= cx + 2; x++) if (is(at(x, 11), "s")) set(x, 11, "h1");
      if (is(at(cx - 3, 12), "s")) set(cx - 3, 12, "h1");
      if (is(at(cx + 2, 12), "s")) set(cx + 2, 12, "h1");
    }
    if (ch.face === "beard") {
      for (y = 9; y <= 14; y++) for (x = hl + 1; x <= hr; x++) {
        if (!is(at(x, y), "s")) continue;
        var side = x <= hl + 1 || x >= hr;
        if (y < 11 && !side) continue;                        /* sideburns only above the cheeks */
        if (y === 12 && x >= cx - 1 && x <= cx) continue;     /* the mouth */
        set(x, y, y === 14 ? "h2" : side ? "h2" : "h1");
      }
    }

    /* ---- clothes ---- */
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      var p = at(x, y);
      if (ch.top === "crop" && y >= 30 && y <= 33) swapRamp(x, y, "t", "s");
      if (ch.top === "sleeves" && y <= 35 && isArm(x, y)) set(x, y, "t" + p.charAt(1));
      if (ch.bottom === "pants" && y >= 42 && y <= 53) swapRamp(x, y, "s", "b");
      if (ch.bottom === "bike" && y >= 42 && y <= 46) swapRamp(x, y, "s", "b");
      if (ch.shoes === "hightops" && y >= 49 && y <= 53) swapRamp(x, y, "s", "f");
      if (ch.shoes === "barefoot" && y >= 54) swapRamp(x, y, "f", "s");
    }

    /* ink outline around anything that now touches the void */
    var add = [];
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      if (at(x, y) !== null) continue;
      var nb = [at(x - 1, y), at(x + 1, y), at(x, y - 1), at(x, y + 1)];
      if (nb.some(function (n) { return n && n.length === 2 && "stbfh".indexOf(n.charAt(0)) >= 0; })) add.push([x, y]);
    }
    add.forEach(function (a) { set(a[0], a[1], "k"); });

    /* colour */
    var R = { s: find(SKIN, ch.skin).r, h: find(HAIRC, ch.hairColor).r, t: find(CLOTH, ch.topColor).r, b: find(CLOTH, ch.bottomColor).r, f: find(CLOTH, ch.shoesColor).r };
    for (i = 0; i < W * H; i++) {
      var lab = L[i], col = null;
      if (lab === null) { d[i * 4 + 3] = 0; continue; }
      if (lab === "k") col = "#0b0414";
      else if (lab === "e") col = "#281424";
      else if (lab.charAt(0) === "x") col = lab.slice(1);
      else col = R[lab.charAt(0)][+lab.charAt(1)];
      d[i * 4] = parseInt(col.slice(1, 3), 16); d[i * 4 + 1] = parseInt(col.slice(3, 5), 16); d[i * 4 + 2] = parseInt(col.slice(5, 7), 16); d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    canvas.setAttribute("aria-label", (ch.sex === "female" ? "Female" : "Male") + " lifter, " + STOPS.fat[ch.fat / 25].toLowerCase() + " and " + STOPS.muscle[ch.muscle / 25].toLowerCase() +
      ", " + find(SKIN, ch.skin).name.toLowerCase() + " skin, " + find(HAIRC, ch.hairColor).name.toLowerCase() + " " + find(HAIR, ch.hair).name.toLowerCase() + " hair");
  }

  /* ---------- camera: full body, head close-up, body close-up (per clothing part) ---------- */
  var cam = "full", part = "top";
  function aim() {
    if (cam === "full") { rig.style.transform = ""; return; }
    var f = cam === "head" ? [26, 9] : PARTS[part].focus, sc = cam === "head" ? 2.7 : PARTS[part].scale;
    var px = f[0] * 4, py = f[1] * 4;
    var tx = stage.clientWidth / 2 - (rig.offsetLeft + px), ty = stage.clientHeight / 2 - (rig.offsetTop + py);
    rig.style.transformOrigin = px + "px " + py + "px";
    rig.style.transform = "translate(" + tx + "px, " + ty + "px) scale(" + sc + ")";
  }
  function setCam(next) {
    if (next === cam) next = "full";
    cam = next;
    stage.classList.toggle("is-zoom", cam !== "full");
    ["full", "head", "body"].forEach(function (c) {
      var p = $("chr-p-" + c); p.hidden = c !== cam;
      if (c === cam) restart(p, "is-in");
    });
    $("chr-zoomtag").textContent = cam === "head" ? "HEAD" : "BODY";
    $("chr-zoomtag").style.setProperty("--tag-c", cam === "head" ? "var(--lime)" : "var(--sky)");
    if (cam === "body") renderPart();
    aim();
  }
  $("chr-out").innerHTML = PX.icon("back") + "<span>Full body</span>";
  $("chr-out").onclick = function () { setCam("full"); };
  document.querySelectorAll("[data-cam]").forEach(function (b) { b.addEventListener("click", function () { setCam(b.dataset.cam); }); });

  /* ---------- option controls ---------- */
  function group(label, key, list, kind) {
    var box = document.createElement("div");
    var head = document.createElement("div"); head.className = "chr-row";
    head.innerHTML = '<p class="chr-label"></p><span class="chr-now"></span>';
    head.firstChild.textContent = label;
    box.appendChild(head);
    var row = document.createElement("div"); row.className = kind === "sw" ? "chr-sws" : "chr-chips";
    row.setAttribute("role", "group"); row.setAttribute("aria-label", label);
    list.forEach(function (o) {
      var b = document.createElement("button"); b.type = "button"; b.dataset.id = o.id;
      if (kind === "sw") {
        b.className = "chr-sw"; b.setAttribute("aria-label", o.name); b.title = o.name;
        b.style.setProperty("--a", o.r[0]); b.style.setProperty("--b", o.r[1]); b.style.setProperty("--c", o.r[2]);
      } else { b.className = "chr-chip"; b.textContent = o.name; }
      b.onclick = function () { var p = {}; p[key] = o.id; set(p); };
      row.appendChild(b);
    });
    box.appendChild(row);
    box.sync = function () {
      row.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.id === ch[key])); });
      head.lastChild.textContent = find(list, ch[key]).name;
    };
    return box;
  }
  var controls = [];
  var headPanel = $("chr-p-head");
  [group("Skin", "skin", SKIN, "sw"), group("Hair", "hair", HAIR), group("Hair colour", "hairColor", HAIRC, "sw"), group("Facial hair", "face", FACE)]
    .forEach(function (g) { headPanel.appendChild(g); controls.push(g); });

  var partHost = $("chr-part"), partControls = [];
  function renderPart() {
    var P = PARTS[part];
    partHost.textContent = "";
    partControls = [group(P.label + " style", P.styleKey, P.styles), group(P.label + " colour", P.colorKey, CLOTH, "sw")];
    partControls.forEach(function (g) { partHost.appendChild(g); g.sync(); });
    partHost.firstChild.style.marginBottom = "var(--s3)";
    document.querySelectorAll(".chr-tab").forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.part === part)); t.tabIndex = t.dataset.part === part ? 0 : -1; });
  }
  document.querySelectorAll(".chr-tab").forEach(function (t) {
    t.addEventListener("click", function () { part = t.dataset.part; renderPart(); aim(); });
  });

  function render(animate) {
    paint();
    var caption = BUILDS[ch.fat / 25][ch.muscle / 25];
    var changed = cap.textContent !== caption;
    cap.textContent = caption;
    cap.style.fontSize = caption.length > 21 ? "17px" : "";
    sexBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.sex === ch.sex)); });
    sliders.forEach(function (box) {
      var key = box.dataset.key, v = ch[key], i = v / 25;
      var input = box.querySelector("input");
      input.value = v;
      input.style.setProperty("--f", String(i / 4));
      input.setAttribute("aria-valuetext", STOPS[key][i]);
      box.querySelector(".chr-now").textContent = STOPS[key][i];
      box.querySelectorAll(".chr-ticks i").forEach(function (t, j) {
        t.style.left = "calc(14px + (100% - 28px) * " + (j / 4) + ")";
        t.classList.toggle("on", j <= i);
      });
    });
    controls.concat(partControls).forEach(function (g) { g.sync(); });
    if (animate) {
      restart(rig, "is-pop");
      if (changed && cam === "full") restart(cap, "is-stamp");
    }
  }

  function snapshot() { var o = {}; for (var k in ch) o[k] = ch[k]; return o; }
  function set(patch) {
    var before = JSON.stringify(ch);
    for (var k in patch) ch[k] = patch[k];
    if (before === JSON.stringify(ch)) return;
    PX.save({ character: snapshot() });
    render(true);
  }

  sexBtns.forEach(function (b) { b.addEventListener("click", function () { set({ sex: b.dataset.sex }); }); });
  sliders.forEach(function (box) {
    var key = box.dataset.key, input = box.querySelector("input");
    input.addEventListener("input", function () { var p = {}; p[key] = PX.snap(+input.value); set(p); });
    box.querySelectorAll(".chr-ends button").forEach(function (b) {
      b.addEventListener("click", function () { var p = {}; p[key] = +b.dataset.v; set(p); });
    });
  });

  /* data-schema: the user can open the sliders again any time; keep the history of body changes */
  var edit = PX.editMode();
  function commitBody() {
    var hist = (PX.get().bodyHistory || []).slice(), last = hist[hist.length - 1];
    if (!last || last.sex !== ch.sex || last.fat !== ch.fat || last.muscle !== ch.muscle) hist.push({ at: Date.now(), sex: ch.sex, fat: ch.fat, muscle: ch.muscle });
    PX.save({ character: snapshot(), bodyHistory: hist });
  }
  if (edit) {
    var kk = $("chr-kicker");
    kk.textContent = "PROFILE · REBUILD BODY"; kk.classList.add("edit-kicker");
    document.querySelector(".steps").hidden = true;
    $("chr-next").textContent = "Save my look";
  }
  $("chr-next").addEventListener("click", function () {
    commitBody();
    PX.go(edit ? "profile" : "class");
  });

  /* loading and error states for the sprite atlas */
  var msg = $("chr-msg");
  var img = new Image();
  img.onload = function () {
    stage.classList.remove("is-loading"); msg.textContent = "";
    atlas = img;
    canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
    canvas.setAttribute("role", "img");
    try { canvas.getContext("2d").drawImage(img, 0, 0); canvas.getContext("2d").getImageData(0, 0, 1, 1); art.appendChild(canvas); }
    catch (e) { fallback = true; }   /* tainted canvas: plain sprite, no recolour */
    render(false);
  };
  img.onerror = function () {
    stage.classList.remove("is-loading"); stage.classList.add("is-broken");
    msg.textContent = "YOUR LIFTER SKIPPED LEG DAY AND THE SPRITE. THE SLIDERS STILL WORK.";
  };
  img.src = window.PX_ATLAS || "../moodboard/creator/body_atlas.png";

  /* ?cam=head|body opens a close-up on load, for screenshots */
  var m = /[?&]cam=(head|body)/.exec(location.search);
  render(false);
  if (m) setTimeout(function () { setCam(m[1]); }, 50);
})();
</script>
</body>
</html>

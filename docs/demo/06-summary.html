<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Setup summary</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<style>
  /* ---------- 06 setup summary: screen-only styles (.sum-) ---------- */
  .sum-top { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: var(--s3); }
  .sum-top .kicker { text-align: center; }
  .sum-screen { padding-top: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
  .sum-head .title { margin-top: 0; }
  .sum-head .sub { margin-top: var(--s1); }

  /* the character card */
  .sum-card { --cc: var(--lime); --shadow-c: var(--cc); padding: 0; margin-right: 8px; }

  /* mini backdrop in the area's sky / floor */
  .sum-stage {
    position: relative; height: 200px; overflow: hidden;
    background: var(--sky-c, var(--bg));
    border-bottom: var(--border-thick);
  }
  .sum-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; background: var(--floor-c, var(--raised)); border-top: 3px solid var(--ink); }
  .sum-floor::after { /* floor cracks / planks, hard pixels */
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(var(--ink), var(--ink)) 14% 40% / 22px 3px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 70% 70% / 30px 3px no-repeat,
      linear-gradient(var(--ink), var(--ink)) 40% 85% / 12px 3px no-repeat;
    opacity: .35;
  }
  /* stars: hard pixels */
  .sum-stars { position: absolute; left: 0; top: 0; width: 3px; height: 3px; background: var(--muted);
    box-shadow: 30px 20px var(--muted), 92px 48px var(--text), 160px 14px var(--muted), 214px 62px var(--muted),
                262px 26px var(--text), 318px 56px var(--muted), 60px 90px var(--muted), 128px 104px var(--text), 300px 112px var(--muted);
    animation: px-blink 2.4s steps(2, end) infinite; }
  /* the class-colour slash across the card (title-card mock) */
  .sum-slash { position: absolute; inset: 0; background: var(--cc); clip-path: polygon(0 52%, 100% 20%, 100% 44%, 0 78%); opacity: .9; }
  .sum-hatch { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent 0 9px, rgba(11, 4, 20, .45) 9px 11px); }

  /* per-area prop, one hard shape each */
  .sum-prop { position: absolute; }
  .sum-prop.riptide   { right: 34px; top: 18px; width: 30px; height: 30px; background: #f6eeff; box-shadow: inset -8px -4px 0 #c9b8e8, 0 0 0 3px var(--ink); }
  .sum-prop.gainsgard { right: 26px; top: 16px; width: 40px; height: 58px; background: #12061f; border: 4px solid var(--ink); box-shadow: inset 0 0 0 4px #8672a5;
                        clip-path: polygon(0 30%, 20% 8%, 50% 0, 80% 8%, 100% 30%, 100% 100%, 0 100%); }
  .sum-prop.rustbelt  { right: 22px; top: 20px; width: 52px; height: 52px;
                        background: repeating-linear-gradient(180deg, var(--orange) 0 8px, transparent 8px 12px); clip-path: polygon(0 100%, 0 50%, 15% 22%, 50% 0, 85% 22%, 100% 50%, 100% 100%); }
  .sum-prop.arcade    { right: 18px; top: 18px; padding: 2px 6px; border: 3px solid var(--lime); color: var(--lime); background: var(--ink);
                        font: 700 10px/1.2 var(--body); letter-spacing: 1px; animation: px-blink 1.6s steps(2, end) infinite; }
  .sum-prop.frostbite { right: 0; bottom: 55px; width: 130px; height: 90px; background: #2a1148;
                        clip-path: polygon(0 100%, 55% 0, 100% 70%, 100% 100%); }
  .sum-prop.frostbite::after { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #c9b8e8;
                        clip-path: polygon(41% 25%, 55% 0, 66% 23%, 58% 30%, 50% 22%); }

  .sum-lifter { position: absolute; right: 26px; bottom: 4px; display: flex; flex-direction: column; align-items: center; }
  .sum-lifter .ground-shadow { width: 120px; margin-top: -10px; }
  .sum-lifter .sprite { animation: px-bob 1.4s steps(2, end) infinite; }

  .sum-area-tag { position: absolute; left: var(--s3); top: var(--s3); --tag-c: var(--ac, var(--lime)); }

  /* stencil class tag (freeze-frame intro card) */
  .sum-who { position: absolute; left: var(--s3); top: 50px; width: 190px; transform: rotate(-6deg); transform-origin: left center; }
  .sum-who b {
    display: inline-block; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ink); background: var(--cc);
    border: 4px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 5px 10px 3px;
    animation: sum-slam .42s steps(6, end) both;
  }
  .sum-who span {
    display: inline-block; margin-top: var(--s2); background: var(--ink); color: var(--cc);
    font: 700 10px/1.35 var(--body); letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px;
    transform: rotate(3deg); animation: sum-slide .3s steps(4, end) .3s both;
  }
  .sum-who.long b { font-size: 24px; }
  @keyframes sum-slam { 0% { transform: scale(2.2); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes sum-slide { 0% { transform: rotate(3deg) translateX(-50px); opacity: 0; } 100% { transform: rotate(3deg); opacity: 1; } }

  .sum-edit-body { position: absolute; left: var(--s3); bottom: var(--s2); }

  /* small EDIT link: a 44px target, looks like a stencil stamp */
  .sum-edit {
    appearance: none; min-width: 52px; min-height: 44px; padding: 0 var(--s2);
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    background: transparent; border: 2px solid var(--line); color: var(--muted);
    font: 700 11px/1 var(--body); letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  }
  .sum-edit svg { width: 12px; height: 12px; }
  .sum-edit:hover { color: var(--text); border-color: var(--muted); }
  .sum-edit:active { transform: translate(2px, 2px); }
  .sum-edit:focus-visible { outline: 3px dashed var(--text); outline-offset: 2px; }
  .sum-edit-body.sum-edit { background: var(--ink); border-color: var(--ink); color: var(--text); box-shadow: 3px 3px 0 var(--line); }

  /* the 3 rows */
  .sum-rows { list-style: none; margin: 0; padding: 0; }
  .sum-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: var(--s3); padding: 10px var(--s3) 10px var(--s4); }
  .sum-row + .sum-row { border-top: 3px solid var(--ink); }
  .sum-ico { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--ic, var(--lime)); }
  .sum-ico svg { width: 18px; height: 18px; }
  .sum-row .kicker { font-size: 10px; }
  .sum-row b { display: block; font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.05; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .sum-row small { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; margin-top: 2px; }
  .sum-row small em { font-style: normal; color: var(--text); font-weight: 700; }

  /* difficulty rung strip: where you sit on the ladder, no numbers */
  .sum-k { display: flex; align-items: center; gap: var(--s2); }
  .sum-rungs { display: flex; gap: 2px; }
  .sum-rungs i { width: 12px; height: 6px; background: var(--raised); border: 1px solid var(--ink); }
  .sum-rungs i.on { background: var(--dc, var(--lime)); }
  .sum-rungs i.me { background: var(--dc, var(--lime)); box-shadow: 0 0 0 2px var(--text); }

  /* first workout preview */
  .sum-quest { display: flex; flex-direction: column; gap: var(--s2); margin-right: 8px; }
  .sum-quest-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
  .sum-quest-head .display { font-size: 18px; color: var(--text); }
  .sum-quest ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
  .sum-quest li {
    background: var(--surface); border: var(--border); box-shadow: 3px 3px 0 var(--line);
    padding: var(--s2); min-height: 62px; display: flex; flex-direction: column; justify-content: space-between; gap: var(--s1);
  }
  .sum-quest li b { font-family: var(--display); font-weight: 400; font-size: 16px; line-height: 1.05; letter-spacing: 1px; text-transform: uppercase; }
  .sum-slots { display: flex; gap: 3px; }
  .sum-slots i { width: 10px; height: 10px; border: 2px dashed var(--muted); opacity: .7; }

  /* LET'S GO moment: full-screen launch card */
  .sum-go {
    position: absolute; inset: 0; z-index: 45; overflow: hidden; cursor: pointer;
    background: var(--sky-c, var(--bg));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .sum-go::before { /* the class slash wipes across */
    content: ""; position: absolute; inset: 0; background: var(--cc);
    clip-path: polygon(0 48%, 100% 30%, 100% 56%, 0 74%);
    animation: sum-wipe .24s steps(4, end) both;
  }
  .sum-go::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-55deg, rgba(11, 4, 20, .6) 0 12px, transparent 12px 24px); }
  .sum-go-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: var(--floor-c, var(--raised)); border-top: 4px solid var(--ink); }
  .sum-go-lifter { position: relative; z-index: 2; filter: grayscale(1) contrast(1.6); animation: sum-rise .36s steps(4, end) .12s both, sum-shake .32s steps(6, end) .5s; }
  .sum-go-tag {
    position: relative; z-index: 3; margin-top: -28px;
    font-family: var(--display); font-size: 76px; line-height: .9; letter-spacing: 2px; text-transform: uppercase;
    color: var(--ink); background: var(--lime); border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink), 8px 8px 0 4px var(--cc);
    padding: 8px 18px 4px; transform: rotate(-7deg);
    animation: sum-big .42s steps(6, end) .4s both;
  }
  .sum-go-sub {
    position: relative; z-index: 3; margin-top: var(--s5); max-width: 300px; text-align: center;
    background: var(--ink); color: var(--cc); padding: 6px 12px;
    font: 700 12px/1.4 var(--body); letter-spacing: 1px; text-transform: uppercase; transform: rotate(-3deg);
    animation: sum-slide2 .3s steps(4, end) .78s both;
  }
  .sum-go-load { position: absolute; z-index: 3; left: var(--s5); right: var(--s5); bottom: var(--s6); height: 14px; background: var(--ink); border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--line); }
  .sum-go-load i { position: absolute; inset: 0 auto 0 0; width: 100%; background: repeating-linear-gradient(90deg, var(--lime) 0 10px, var(--lime-lo) 10px 12px); animation: sum-load 1.5s steps(8, end) .3s both; }
  .sum-go-load + .kicker { position: absolute; z-index: 3; bottom: 64px; color: var(--text); }
  @keyframes sum-wipe { 0% { clip-path: polygon(0 48%, 0 48%, 0 74%, 0 74%); } 100% { clip-path: polygon(0 48%, 100% 30%, 100% 56%, 0 74%); } }
  @keyframes sum-rise { 0% { transform: translateY(80px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes sum-shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(6px, -2px); } 60% { transform: translate(-3px, 0); } 80% { transform: translate(2px, 2px); } 100% { transform: none; } }
  @keyframes sum-big { 0% { transform: rotate(-7deg) scale(3); opacity: 0; } 100% { transform: rotate(-7deg) scale(1); opacity: 1; } }
  @keyframes sum-slide2 { 0% { transform: rotate(-3deg) translateX(-80px); opacity: 0; } 100% { transform: rotate(-3deg); opacity: 1; } }
  @keyframes sum-load { 0% { width: 0; } 100% { width: 100%; } }
</style>
</head>
<body class="px">
<main class="phone" data-screen="summary">
  <header class="topbar sum-top">
    <button class="icon-btn" type="button" id="back" aria-label="Back to starting area"></button>
    <p class="kicker">STEP 5 OF 5</p>
    <div class="steps" aria-label="Step 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i></div>
  </header>

  <section class="screen sum-screen">
    <div class="sum-head">
      <h1 class="title sm">MEET YOUR LIFTER</h1>
      <p class="sub">Last look before the gains start.</p>
    </div>

    <article class="panel big sum-card" id="card" aria-label="Your character">
      <div class="sum-stage" id="stage">
        <div class="sum-stars"></div>
        <div class="sum-prop" id="prop" aria-hidden="true"></div>
        <div class="sum-slash"></div>
        <div class="sum-hatch"></div>
        <div class="sum-floor"></div>
        <span class="nametag sum-area-tag" id="areaTag"></span>
        <div class="sum-who"><b id="clsTag"></b><br><span id="clsSub"></span></div>
        <div class="sum-lifter"><div id="lifter"></div><div class="ground-shadow"></div></div>
        <button class="sum-edit sum-edit-body" type="button" data-go="character" aria-label="Edit body">EDIT BODY</button>
      </div>

      <ul class="sum-rows">
        <li class="sum-row">
          <span class="sum-ico" id="icoPath" aria-hidden="true"></span>
          <div><p class="kicker">PATH</p><b id="pathName"></b><small id="pathLine"></small></div>
          <button class="sum-edit" type="button" data-go="class" aria-label="Edit path">EDIT</button>
        </li>
        <li class="sum-row">
          <span class="sum-ico" id="icoDiff" aria-hidden="true"></span>
          <div><div class="sum-k"><p class="kicker">DIFFICULTY</p><span class="sum-rungs" id="rungs" aria-hidden="true"></span></div><b id="diffName"></b><small id="diffLine"></small></div>
          <button class="sum-edit" type="button" data-go="difficulty" aria-label="Edit difficulty">EDIT</button>
        </li>
        <li class="sum-row">
          <span class="sum-ico" id="icoWorld" aria-hidden="true"></span>
          <div><p class="kicker">WORLD</p><b id="areaName"></b><small id="areaLine"></small></div>
          <button class="sum-edit" type="button" data-go="area" aria-label="Edit world">EDIT</button>
        </li>
      </ul>
    </article>

    <section class="sum-quest" aria-labelledby="questHead">
      <div class="sum-quest-head">
        <span class="display" id="questHead">FIRST WORKOUT</span>
        <span class="kicker">THE APP PICKED IT</span>
      </div>
      <ol id="quest"></ol>
    </section>
  </section>

  <footer class="foot">
    <button class="btn cta" type="button" id="go">LET'S GO</button>
  </footer>
</main>
<script>
(function () {
  "use strict";
  var s = PX.get();

  /* Guard: opened without the picks it needs -> send to the first missing step. */
  var need = [["cls", "class"], ["difficulty", "difficulty"], ["area", "area"]];
  for (var i = 0; i < need.length; i++) {
    if (!s[need[i][0]] || !(need[i][0] === "cls" ? PX.cls() : need[i][0] === "area" ? PX.area() : PX.difficulty())) {
      PX.go(need[i][1], { replace: true });
      return;
    }
  }

  var cl = PX.cls(), df = PX.difficulty(), ar = PX.area(), phone = document.querySelector(".phone");
  var $ = function (id) { return document.getElementById(id); };

  /* pixel icons for the rows, same style as PX.icon */
  var ICO = {
    path: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="9" width="4" height="6"/><rect x="18" y="9" width="4" height="6"/><rect x="6" y="6" width="3" height="12"/><rect x="15" y="6" width="3" height="12"/><rect x="9" y="11" width="6" height="2"/></svg>',
    diff: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="17" width="5" height="4"/><rect x="9" y="11" width="5" height="10"/><rect x="15" y="4" width="5" height="17"/></svg>',
    world: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 2h2v2h10v9H7v9H5zM7 6v5h8V6z"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 3h3v3h3v3h-3v3h-3v3h-3v3H9v3H3v-6h3v-3h3V9h3V6h3z"/></svg>'
  };

  /* card colours */
  var card = $("card");
  [card, phone].forEach(function (el) {
    el.style.setProperty("--cc", PX.c(cl.color));
    el.style.setProperty("--sky-c", ar.sky);
    el.style.setProperty("--floor-c", ar.floor);
  });
  card.style.setProperty("--ac", PX.c(ar.color));

  /* backdrop + lifter */
  $("prop").className = "sum-prop " + ar.id;
  if (ar.id === "arcade") $("prop").textContent = "OPEN 24/7";
  $("areaTag").textContent = ar.name;
  $("clsTag").textContent = cl.name;
  if (cl.name.length > 12) document.querySelector(".sum-who").classList.add("long");
  $("clsSub").textContent = cl.subtitle;
  PX.sprite($("lifter"), s.character, 3);

  /* PATH */
  $("icoPath").innerHTML = ICO.path; $("icoPath").style.setProperty("--ic", PX.c(cl.color));
  $("pathName").textContent = cl.name;
  var eq = document.createElement("em"); eq.textContent = cl.equipment + ".";
  $("pathLine").appendChild(eq);
  $("pathLine").appendChild(document.createTextNode(" " + cl.loadout));

  /* DIFFICULTY + rung strip */
  $("icoDiff").innerHTML = ICO.diff; $("icoDiff").style.setProperty("--ic", PX.c(df.color));
  $("diffName").textContent = df.name;
  $("diffLine").textContent = df.line;
  var idx = PX.DIFFICULTIES.indexOf(df), rungs = $("rungs");
  rungs.style.setProperty("--dc", PX.c(df.color));
  PX.DIFFICULTIES.forEach(function (d, j) {
    var r = document.createElement("i");
    if (j < idx) r.className = "on"; else if (j === idx) r.className = "me";
    rungs.appendChild(r);
  });

  /* WORLD: the area + how sets are logged */
  $("icoWorld").innerHTML = ICO.world; $("icoWorld").style.setProperty("--ic", PX.c(ar.color));
  $("areaName").textContent = ar.name;
  var al = $("areaLine"), how = document.createElement("em");
  how.textContent = ar.hint + " = 1 set.";
  al.appendChild(how);
  al.appendChild(document.createTextNode(" " + ar.record + " keep the count."));

  /* first workout preview: names + empty target slots (no numbers) */
  var q = $("quest");
  PX.workout().forEach(function (ex) {
    var li = document.createElement("li"), b = document.createElement("b"), sl = document.createElement("span");
    b.textContent = ex.name; sl.className = "sum-slots"; sl.setAttribute("aria-label", ex.target + " working sets");
    for (var k = 0; k < ex.target; k++) sl.appendChild(document.createElement("i"));
    li.appendChild(b); li.appendChild(sl); q.appendChild(li);
  });

  /* navigation */
  var back = $("back");
  back.innerHTML = PX.icon("back");
  back.onclick = function () { PX.go("area"); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) {
    if (!b.classList.contains("sum-edit-body")) b.insertAdjacentHTML("afterbegin", ICO.pencil);
    b.onclick = function () { PX.go(b.getAttribute("data-go")); };
  });

  /* LET'S GO: save, launch card, then the hub */
  var going = false;
  $("go").onclick = function () {
    if (going) return; going = true;
    PX.save({ setupDone: true });
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

    var f = document.createElement("div");
    f.className = "sum-go"; f.setAttribute("role", "dialog"); f.setAttribute("aria-label", "Let's go");
    f.innerHTML = '<div class="sum-go-floor"></div><div class="sum-go-lifter"></div>' +
      '<div class="sum-go-tag">LET\'S GO</div><div class="sum-go-sub"></div>' +
      '<div class="sum-go-load"><i></i></div><p class="kicker"></p>';
    f.querySelector(".sum-go-sub").textContent = cl.name + " enters " + ar.name + ". The weights have been warned.";
    f.querySelector(".kicker").textContent = "LOADING THE HUB";
    PX.sprite(f.querySelector(".sum-go-lifter"), s.character, 4);
    phone.appendChild(f);

    var left = false;
    function leave() { if (left) return; left = true; PX.go("hub"); }
    f.addEventListener("click", leave);
    setTimeout(leave, reduce ? 900 : 1900);
  };
})();
</script>
</body>
</html>

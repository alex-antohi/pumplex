<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Class</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<style>
/* ---- 03 class (path) select: screen-only styles ---- */
.cls-screen { display: flex; flex-direction: column; gap: var(--s3); padding-top: var(--s3); }

/* the class card: the lifter big on a stage, everything about the path on the same card */
.cls-card {
  --cls-c: var(--line);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--surface); border: var(--border-thick);
  box-shadow: 8px 8px 0 var(--cls-c);
  margin-right: 8px;
}
.cls-art {
  position: relative; height: 236px; flex: none;
  display: flex; align-items: flex-end; justify-content: center;
  background:
    radial-gradient(color-mix(in srgb, var(--cls-c) 40%, transparent) 2px, transparent 2.5px) 0 0 / 20px 20px,
    var(--raised);
  border-bottom: 4px solid var(--ink);
}
.cls-art::before { /* floor in the path colour */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
  background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(11, 4, 20, .25) 46px 50px), var(--cls-c);
  border-top: 4px solid var(--ink);
}
.cls-art .sprite { position: relative; z-index: 1; margin-bottom: 12px; }
.cls-equip { position: absolute; left: var(--s3); top: var(--s3); z-index: 2; --tag-c: var(--cls-c); }
.cls-sub {
  position: absolute; right: var(--s3); top: 44px; z-index: 2; max-width: 150px;
  padding: 4px 8px; background: var(--ink); color: var(--cls-c); border: 2px solid var(--cls-c);
  font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; line-height: 1.3; text-align: right;
}
.cls-info { display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3) var(--s4) var(--s4); }
.cls-name { font-family: var(--display); font-size: 34px; line-height: 1; letter-spacing: 1px; text-transform: uppercase; color: var(--cls-c); text-shadow: 3px 3px 0 var(--ink); }
.cls-load { margin: 0; font-size: 13px; line-height: 1.4; color: var(--text); font-weight: 700; }
.cls-desc { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.cls-tags .nametag { --tag-c: var(--cls-c); color: var(--text); padding: 2px 6px; }
</style>
</head>
<body class="px">
<main class="phone" data-screen="class">
  <header class="topbar setup-top">
    <button class="icon-btn" type="button" id="cls-back" aria-label="Back to character creation"></button>
    <div class="setup-t">
      <div class="setup-k"><p class="kicker" id="cls-kicker">STEP 2 OF 5</p><div class="steps" role="img" aria-label="Setup step 2 of 5"><i class="on"></i><i class="now"></i><i></i><i></i><i></i></div></div>
      <h1 class="title">What do you train with?</h1>
    </div>
  </header>

  <section class="screen cls-screen">
    <div id="cls-pick" role="group" aria-roledescription="carousel" aria-label="Path"></div>
    <p class="swp-hint">Swipe for the other paths. The path decides your workouts.</p>
  </section>

  <footer class="foot">
    <button class="btn cta" type="button" id="cls-next">NEXT: DIFFICULTY</button>
  </footer>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var next = $("cls-next"), IDS = PX.CLASS_ORDER;

  $("cls-back").innerHTML = PX.icon("back");
  $("cls-back").onclick = function () { PX.go("character"); };

  function renderCard(el, i) {
    var k = PX.CLASSES[IDS[i]];
    el.className = "swp-card cls-card";
    el.style.setProperty("--cls-c", PX.c(k.color));
    el.setAttribute("role", "tabpanel");
    el.innerHTML =
      '<div class="cls-art"><span class="nametag cls-equip"></span><span class="cls-sub"></span><div class="cls-spr"></div></div>' +
      '<div class="cls-info"><span class="cls-name"></span><p class="cls-load"></p><div class="chips cls-tags"></div><p class="cls-desc"></p></div>';
    el.querySelector(".cls-equip").textContent = k.equipment;
    el.querySelector(".cls-sub").textContent = k.subtitle;
    el.querySelector(".cls-name").textContent = k.name;
    el.querySelector(".cls-load").textContent = k.loadout;
    el.querySelector(".cls-desc").textContent = k.description;
    var tags = el.querySelector(".cls-tags");
    k.tags.forEach(function (t) { var s = document.createElement("span"); s.className = "nametag"; s.textContent = t; tags.appendChild(s); });
    var spr = el.querySelector(".cls-spr");
    PX.sprite(spr, k.body, 3);
    spr.setAttribute("aria-label", k.name + ": " + k.equipment);
  }

  var saved = PX.get().cls, start = Math.max(0, IDS.indexOf(saved));
  PX.picker({
    root: $("cls-pick"), count: IDS.length, index: start, loop: true,
    color: function (i) { return PX.c(PX.CLASSES[IDS[i]].color); },
    label: function (i) { return PX.CLASSES[IDS[i]].name; },
    render: renderCard,
    onChange: function (i) { PX.save({ cls: IDS[i] }); }
  });
  PX.save({ cls: IDS[start] });

  var edit = PX.editMode();
  next.onclick = function () {
    if (edit) { PX.toast("NEW PATH. NEW WORKOUTS FROM THE NEXT SESSION.", { ms: 1400 }); setTimeout(function () { PX.go("profile"); }, 900); }
    else PX.go("difficulty");
  };
  if (edit) {
    $("cls-kicker").textContent = "PROFILE · CHANGE PATH"; $("cls-kicker").classList.add("edit-kicker");
    document.querySelector(".steps").hidden = true;
    next.textContent = "SAVE PATH";
    $("cls-back").setAttribute("aria-label", "Back to the profile");
    $("cls-back").onclick = function () { PX.go("profile"); };
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Preloader</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>
<style>
/* ---------- Preloader (screen 1). Everything here is prefixed .pre- ---------- */
.pre {
  cursor: pointer;
  background:
    repeating-linear-gradient(0deg, rgba(11, 4, 20, .35) 0 2px, transparent 2px 4px),
    var(--bg);
}
.pre .screen { display: flex; flex-direction: column; gap: var(--s4); padding-top: var(--s5); overflow: hidden; }

/* top strip */
.pre-top { display: flex; justify-content: space-between; align-items: center; }
.pre-top .kicker b { color: var(--pink); }

/* logotype: Anton, stacked neon hard shadows, slammed in */
.pre-logo { position: relative; margin: var(--s2) 0 0; text-align: center; }
.pre-logo h1 {
  margin: 0;
  font-family: var(--display); font-weight: 400; text-transform: uppercase;
  font-size: 92px; line-height: .9; letter-spacing: 2px;
  color: var(--text);
  text-shadow: 4px 4px 0 var(--pink), 8px 8px 0 var(--violet), 12px 12px 0 var(--ink);
  transform: rotate(-4deg);
  animation: pre-logo-in .42s steps(6, end) both;
}
.pre-logo h1 span { display: inline-block; }
.pre-logo h1 span:nth-child(odd) { transform: translateY(-3px); }
.pre-tag {
  display: inline-block; margin-top: var(--s4);
  font-family: var(--display); font-size: 20px; letter-spacing: 1px; text-transform: uppercase; line-height: 1;
  color: var(--ink); background: var(--orange);
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 5px 12px 3px; transform: rotate(-3deg);
  animation: px-slide .3s steps(4, end) .35s both;
}
@keyframes pre-logo-in {
  0% { transform: rotate(-4deg) scale(2.4); opacity: 0; }
  100% { transform: rotate(-4deg) scale(1); opacity: 1; }
}

/* the stage: dark sky above, light floor under the lifter (area rule) */
.pre-stage {
  position: relative; flex: 1; min-height: 230px;
  box-shadow: 6px 6px 0 var(--pink);
  overflow: hidden;
}
.pre-stage::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 58px;
  background:
    repeating-linear-gradient(90deg, transparent 0 34px, rgba(11, 4, 20, .25) 34px 36px),
    var(--violet-lo);
  border-top: 4px solid var(--ink);
}
.pre-who { position: absolute; left: var(--s3); top: var(--s3); z-index: 3; }
.pre-lift {
  position: absolute; left: 50%; bottom: 42px; z-index: 2;
  width: 156px; height: 192px; margin-left: -78px;
}
.pre-lift .ground-shadow { position: absolute; left: 18px; right: 18px; bottom: -6px; }
.pre-body { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; animation: pre-squat 1s steps(1, end) infinite; }

/* pixel barbell: ink bar with two neon plates per side */
.pre-bar {
  position: absolute; left: -46px; right: -46px; height: 8px;
  background: var(--muted); border: 2px solid var(--ink);
  bottom: 28px;
  animation: pre-pull 1s steps(1, end) infinite;
}
.pre-bar i {
  position: absolute; top: 50%; width: 16px; height: 64px; margin-top: -32px;
  background: var(--pink); border: 3px solid var(--ink);
  box-shadow: inset 3px 3px 0 var(--pink-hi), inset -3px -3px 0 var(--pink-lo);
}
.pre-bar i.b { width: 12px; height: 46px; margin-top: -23px; background: var(--sky); box-shadow: inset 2px 2px 0 var(--sky-hi), inset -2px -2px 0 var(--sky-lo); }
.pre-bar i:nth-child(1) { left: 2px; }
.pre-bar i:nth-child(2) { left: 17px; }
.pre-bar i:nth-child(3) { right: 17px; }
.pre-bar i:nth-child(4) { right: 2px; }
/* deadlift loop: low (crouch, bar on the floor) then lockout (bar at the hands) */
@keyframes pre-squat { 0% { transform: scaleY(.84) scaleX(1.04); } 50% { transform: none; } }
@keyframes pre-pull { 0% { bottom: 28px; } 50% { bottom: 56px; } }

/* a spinning neon starburst behind the lifter: the "loading" spinner, in 8 hard steps */
.pre-burst {
  position: absolute; left: 50%; bottom: 40px; z-index: 1;
  width: 250px; height: 250px; margin-left: -125px;
  background: var(--violet-lo);
  animation: pre-spin 2.4s steps(8, end) infinite;
}
.pre-burst::after { content: ""; position: absolute; inset: 34px; background: var(--raised); clip-path: inherit; }
@keyframes pre-spin { to { transform: rotate(360deg); } }

/* "rep" pop at lockout */
.pre-pop {
  position: absolute; right: var(--s3); top: 46px; z-index: 3;
  font-family: var(--display); font-size: 24px; letter-spacing: 1px; line-height: 1; text-transform: uppercase;
  color: var(--ink); background: var(--sky); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  padding: 4px 8px 2px; transform: rotate(6deg);
  animation: pre-pop 1s steps(1, end) infinite;
}
@keyframes pre-pop { 0% { opacity: 0; } 50% { opacity: 1; } 90% { opacity: 0; } }

/* loader: chunky segmented bar that fills in hard steps */
.pre-load { display: flex; flex-direction: column; gap: var(--s2); }
.pre-load-head { display: flex; justify-content: space-between; align-items: baseline; }
.pre-load-head .display { font-size: 22px; }
.pre-pct { font-family: var(--display); font-size: 28px; line-height: 1; color: var(--orange); min-width: 3.2ch; text-align: right; }
.pre-bar-track {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px;
  height: 34px; padding: 4px;
  background: var(--ink); border: 4px solid var(--ink);
  box-shadow: 0 0 0 3px var(--line), 6px 6px 0 var(--violet-lo);
}
.pre-bar-track i { background: var(--raised); }
.pre-bar-track i.on { background: var(--orange); box-shadow: inset 0 4px 0 var(--orange-hi), inset 0 -4px 0 var(--orange-lo); }
.pre-bar-track i.new { background: var(--orange-hi); }
.pre-bar-track.done i.on { background: var(--pink); box-shadow: inset 0 4px 0 var(--pink-hi), inset 0 -4px 0 var(--pink-lo); }
.pre-line {
  min-height: 42px; margin: 0;
  font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
}
.pre-line::after { content: "_"; color: var(--pink); animation: px-blink .5s steps(1, end) infinite; }
.pre-line.swap { animation: pre-swap .16s steps(2, end); }
@keyframes pre-swap { 0% { transform: translateX(-14px); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* skip hint (also the keyboard way to skip) */
.pre .foot { padding-top: 0; }
.pre-skip { animation: px-blink 1s steps(1, end) infinite; width: 100%; }
.pre-skip:focus-visible { animation: none; color: var(--text); }
</style>
</head>
<body class="px">
<main class="phone pre" data-screen="preloader" aria-busy="true">
  <section class="screen">
    <div class="pre-top">
      <p class="kicker">Offline · <b>Single player</b></p>
      <p class="kicker">v0.1</p>
    </div>

    <div class="pre-logo">
      <h1 aria-label="PUMPLEX"><span>P</span><span>U</span><span>M</span><span>P</span><span>L</span><span>E</span><span>X</span></h1>
      <div class="pre-tag">Train. Don't track.</div>
    </div>

    <div class="stage pre-stage" aria-hidden="true">
      <span class="nametag pre-who" id="pre-who">New challenger</span>
      <span class="pre-pop">Rep!</span>
      <div class="pre-burst starburst"></div>
      <div class="pre-lift">
        <div class="ground-shadow"></div>
        <div class="pre-body" id="pre-body"></div>
        <div class="pre-bar"><i></i><i class="b"></i><i class="b"></i><i></i></div>
      </div>
    </div>

    <div class="pre-load">
      <div class="pre-load-head">
        <span class="display" id="pre-status">Loading gains</span>
        <span class="pre-pct" id="pre-pct">0%</span>
      </div>
      <div class="pre-bar-track" id="pre-track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <p class="pre-line" id="pre-line" aria-live="polite">Waking up the barbell</p>
    </div>
  </section>

  <footer class="foot">
    <button class="btn ghost pre-skip" type="button" id="pre-skip">Tap to skip</button>
  </footer>
</main>

<script>
(function () {
  "use strict";
  var s = PX.get();
  var phone = document.querySelector(".pre");

  /* the lifter: whatever body the player built (default body for a new player) */
  PX.sprite(document.getElementById("pre-body"), s.character, 3);

  /* who's loading: new player vs returning */
  var who = document.getElementById("pre-who");
  var k = PX.cls();
  if (s.setupDone && k) {
    var lv = PX.levelInfo(s.xp || 0);
    who.textContent = "Welcome back · LV " + lv.level + " " + k.name;
    who.style.setProperty("--tag-c", PX.c(k.color));
  } else {
    who.style.setProperty("--tag-c", PX.c("sky"));
  }

  /* jokes: a fresh shuffle every launch, first line fixed */
  var JOKES = [
    "Chalking the loading bar",
    "Counting your gains. Twice.",
    "Bribing the squat rack",
    "Untangling the cables",
    "Re-racking someone else's plates",
    "Teaching the dumbbells to sit",
    "Hiding the curl bar from bros",
    "Ironing the iron",
    "Pre-workout for the CPU",
    "Telling your couch it's over"
  ];
  if (s.setupDone) JOKES.push("Your sweat is still on the bench", "The barbell missed you. It said so.");
  for (var i = JOKES.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = JOKES[i]; JOKES[i] = JOKES[j]; JOKES[j] = t; }

  var SEGS = 12, track = document.getElementById("pre-track");
  for (var n = 0; n < SEGS; n++) track.appendChild(document.createElement("i"));
  var cells = track.children;
  var pct = document.getElementById("pre-pct"), line = document.getElementById("pre-line"), status = document.getElementById("pre-status");

  /* uneven hard steps, with a fake stall near the end (the joke of every loader) */
  var PLAN = [[150, 2], [420, 4], [640, 5], [900, 7], [1200, 8], [1450, 10], [1950, 11], [2250, 12]];
  var LINE_AT = [0, 750, 1500, 2250];
  var DONE_AT = 2550;

  function setSeg(on) {
    for (var x = 0; x < SEGS; x++) {
      cells[x].classList.toggle("on", x < on);
      cells[x].classList.remove("new");
    }
    if (on > 0 && on < SEGS) cells[on - 1].classList.add("new");
    var p = on >= SEGS ? 100 : Math.min(99, Math.round(on / SEGS * 100));
    pct.textContent = p + "%";
    track.setAttribute("aria-valuenow", p);
    if (on >= SEGS) {
      track.classList.add("done");
      status.textContent = "Fully pumped";
      pct.style.color = "var(--pink)";
    }
  }
  function say(txt) {
    line.textContent = txt;
    line.classList.remove("swap"); void line.offsetWidth; line.classList.add("swap");
  }

  var timers = [];
  PLAN.forEach(function (p) { timers.push(setTimeout(function () { setSeg(p[1]); }, p[0])); });
  LINE_AT.forEach(function (at, idx) {
    if (idx === 0) { say(JOKES[0]); return; }
    timers.push(setTimeout(function () {
      say(idx === LINE_AT.length - 1 ? (s.setupDone ? "Loaded. Your gains are where you left them." : "Loaded. Time to build a lifter.") : JOKES[idx]);
    }, at));
  });

  /* leave: auto after the bar fills, or straight away on tap / key */
  var gone = false;
  function leave() {
    if (gone) return;
    gone = true;
    timers.forEach(clearTimeout);
    setSeg(SEGS);
    phone.setAttribute("aria-busy", "false");
    PX.go(PX.homeId(), { replace: true });
  }
  timers.push(setTimeout(leave, DONE_AT));
  phone.addEventListener("click", leave);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Tab" || e.key === "Shift") return;
    leave();
  });
})();
</script>
</body>
</html>

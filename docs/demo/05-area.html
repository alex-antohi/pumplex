<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUMPLEX · Starting area</title>
<link rel="stylesheet" href="shared/pumplex.css">
<script src="shared/demo.js"></script>

<!-- ======================================================================
     AREA SCENES (CSS). Ported from docs/moodboard/canvas/StartingAreas.dc.html.
     Self-contained: every class starts with .ar-. Scene is 350 x 300 inside a
     4 px ink border (358 x 308 outer). Rule: dark sky above, light floor (72 px)
     below, lifter at 2x on the floor with a ground shadow, one action object.
     Used by renderScene() below. The workout screen ports the same scenes.
     ====================================================================== -->
<style id="ar-scene-css">
.ar-scene { position: relative; width: 350px; height: 300px; box-sizing: content-box; overflow: hidden; border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ar-c, var(--pink)); }
.ar-scene > * { position: absolute; }
.ar-scene.shake { animation: px-shake .32s steps(6, end); }
.ar-lifter { left: 12px; bottom: 26px; z-index: 5; }
.ar-shadow { left: 18px; bottom: 20px; width: 92px; height: 10px; background: rgba(11, 4, 20, .45); border-radius: 50%; z-index: 4; }
.ar-stars { inset: 0; background-image: radial-gradient(#f6eeff 1px, transparent 1.6px), radial-gradient(#c9b8e8 1px, transparent 1.6px); background-size: 41px 31px, 67px 47px; background-position: 5px 7px, 23px 19px; animation: ar-twinkle 2.4s steps(2, end) infinite; }
.ar-hint { left: -4px; top: 12px; z-index: 8; padding: 5px 12px 4px; border: 3px solid var(--ink); font-family: var(--display); font-size: 17px; letter-spacing: 1px; line-height: 1; color: var(--ink); background: var(--ar-c); transform: rotate(-2deg); animation: ar-nudge 1.4s steps(2, end) infinite; pointer-events: none; }
.ar-hit { position: absolute; z-index: 6; background: transparent; border: 0; padding: 0; margin: 0; }
button.ar-hit { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.ar-hit > span { position: absolute; display: block; }
.ar-hit:focus-visible { outline: 3px dashed var(--text); outline-offset: 4px; }
.ar-ring { inset: -8px; border: 3px dashed var(--text); opacity: .55; animation: ar-ring 1.4s steps(2, end) infinite; }
.ar-anim { }
.ar-fx { inset: 0; z-index: 9; pointer-events: none; }
.ar-fx > * { position: absolute; }

/* +1 SET starburst: ink star with the area colour inside */
.ar-burst { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; animation: ar-burst .5s steps(5, end) both; z-index: 10; }
.ar-burst::before, .ar-burst::after { content: ""; position: absolute; inset: 0; clip-path: polygon(50% 0,61% 30%,93% 18%,74% 45%,100% 62%,68% 66%,72% 100%,50% 76%,28% 100%,32% 66%,0 62%,26% 45%,7% 18%,39% 30%); }
.ar-burst::before { background: var(--ink); }
.ar-burst::after { inset: 7px; background: var(--fx); }
.ar-burst b { position: relative; z-index: 1; font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1; color: var(--ink); text-align: center; transform: rotate(-8deg); }

/* records (what stays in the world) and per-area effects */
.ar-new { animation: ar-pop .22s steps(4, end) both; }
.ar-shell { display: block; width: 20px; height: 15px; border: 3px solid var(--ink); border-radius: 50% 50% 4px 4px; background: repeating-linear-gradient(90deg, #ff5fb0 0 3px, #ff98c2 3px 5px); box-shadow: inset 0 -4px 0 #a63e84; }
.ar-pearl { display: block; width: 17px; height: 17px; border: 3px solid var(--ink); border-radius: 50%; background: #88dff3; box-shadow: inset -5px -5px 0 #3681b2, inset 3px 3px 0 #f6eeff; }
.ar-lid { transform-origin: 6px 100%; }
.ar-busy .ar-lid { animation: ar-lid .6s steps(4, end) both; }
.ar-flyer { z-index: 7; animation: ar-fly .5s steps(6, end) both; }
.ar-stroke { position: relative; display: block; width: 6px; height: 44px; background: #f6eeff; box-shadow: 2px 0 0 #c9b8e8; transform-origin: top; }
.ar-stroke.ar-new { animation: ar-scratch .2s steps(3, end) both; }
.ar-slash { position: absolute; left: -10px; top: 17px; width: 56px; height: 6px; background: #f6eeff; box-shadow: 0 2px 0 #c9b8e8; transform: rotate(-28deg); transform-origin: left; }
.ar-slash.ar-new { animation: ar-scratchx .2s steps(3, end) both; }
.ar-dust { position: absolute; left: 0; bottom: -12px; width: 44px; height: 8px; background-image: radial-gradient(#f6eeff 1.2px, transparent 1.6px); background-size: 7px 5px; opacity: .7; }
.ar-tag { display: inline-flex; flex-direction: column; align-items: center; }
.ar-tag b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: .9; transform: rotate(-8deg); text-shadow: 2px 2px 0 var(--ink); }
.ar-tag i { width: 4px; margin-top: -3px; }
.ar-barrel { left: 0; bottom: 0; width: 44px; height: 60px; border: 3px solid var(--ink); border-radius: 5px; box-sizing: border-box; background: repeating-linear-gradient(45deg, #ffa033 0 7px, #0b0414 7px 14px); box-shadow: inset 0 6px 0 #a6643c, inset 0 -6px 0 #a6643c; animation: ar-rollin .45s steps(5, end) both; }
.ar-busy .ar-barrel, .ar-busy .ar-ice { display: none; }
.ar-boom { animation: ar-boom .6s steps(6, end) both; }
.ar-puff { border-radius: 50%; background: #593597; border: 3px solid var(--ink); animation: ar-puff .6s steps(6, end) both; }
.ar-debris { width: 8px; height: 8px; background: #a6643c; border: 2px solid var(--ink); animation: ar-debris .6s steps(6, end) both; }
.ar-busy .ar-pad { animation: ar-punch .45s steps(5, end) both; }
.ar-ticket { display: block; flex: none; width: 11px; height: 9px; background: #ffc075; border: 2px solid var(--ink); box-sizing: border-box; box-shadow: inset 0 -2px 0 #ffa033; }
.ar-ice { left: 0; bottom: 0; width: 56px; height: 50px; box-sizing: border-box; border: 3px solid var(--ink); background: #88dff3; box-shadow: inset 8px 8px 0 #c9f2ff, inset -8px -8px 0 #3681b2; animation: ar-reform .4s steps(4, end) both; }
.ar-shard { width: 12px; height: 12px; background: #88dff3; border: 2px solid var(--ink); animation: ar-shard .55s steps(6, end) both; }
.ar-flag { position: absolute; width: 20px; height: 30px; z-index: 3; }
.ar-flag i { position: absolute; left: 0; bottom: 0; width: 3px; height: 30px; background: #f6eeff; border: 1px solid var(--ink); }
.ar-flag b { position: absolute; left: 4px; top: 0; width: 15px; height: 11px; border: 2px solid var(--ink); }

@keyframes ar-twinkle { 50% { background-position: 5px 7px, 24px 19px; opacity: .6; } }
@keyframes ar-waves { to { background-position: 30px 0; } }
@keyframes ar-flick { 0%, 100% { transform: scaleY(1); } 33% { transform: scaleY(.8) translateX(1px); } 66% { transform: scaleY(1.12) translateX(-1px); } }
@keyframes ar-neon { 0%, 86%, 100% { opacity: 1; } 88% { opacity: .25; } 90% { opacity: 1; } 93% { opacity: .4; } }
@keyframes ar-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@keyframes ar-snow { to { background-position: 0 54px, 12px 90px; } }
@keyframes ar-sway { 50% { transform: skewX(-6deg); } }
@keyframes ar-drift { to { transform: translateX(-18px) skewY(-6deg); } }
@keyframes ar-nudge { 50% { transform: rotate(-2deg) translateY(-3px); } }
@keyframes ar-ring { 50% { opacity: .15; } }
@keyframes ar-burst { 0% { transform: scale(.2) rotate(-40deg); } 60% { transform: scale(1.15) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes ar-lid { 0% { transform: none; } 40% { transform: rotate(-42deg) translateY(-8px); } 100% { transform: rotate(-34deg) translateY(-6px); } }
@keyframes ar-fly { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(42px, -80px) rotate(180deg); } 100% { transform: translate(86px, 30px) rotate(360deg); opacity: 0; } }
@keyframes ar-pop { 0% { transform: scale(2.2) rotate(-14deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes ar-scratch { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
@keyframes ar-scratchx { 0% { transform: rotate(-28deg) scaleX(0); } 100% { transform: rotate(-28deg) scaleX(1); } }
@keyframes ar-rollin { 0% { transform: translateX(150px) rotate(90deg); } 100% { transform: none; } }
@keyframes ar-boom { 0% { transform: scale(.2); } 35% { transform: scale(1.25); } 100% { transform: scale(1.4); opacity: 0; } }
@keyframes ar-puff { 0% { transform: scale(.3); } 100% { transform: scale(1.6) translateY(-30px); opacity: 0; } }
@keyframes ar-debris { 100% { transform: translate(var(--dx), var(--dy)) rotate(270deg); opacity: 0; } }
@keyframes ar-punch { 0% { transform: none; } 25% { transform: translateX(22px) scaleX(.7); } 60% { transform: translateX(-6px); } 100% { transform: none; } }
@keyframes ar-reform { 0% { transform: scale(0); } 100% { transform: scale(1); } }
@keyframes ar-shard { 100% { transform: translate(var(--dx), var(--dy)) rotate(200deg); opacity: 0; } }
</style>

<style>
/* ---------- 05 starting area: screen-only styles (.ar-…) ---------- */
.ar-screen { display: flex; flex-direction: column; gap: var(--s3); padding-top: var(--s3); }
.ar-head .title { font-size: 36px; }
.ar-head .sub { margin-top: var(--s2); }

.ar-stage { position: relative; width: 358px; max-width: 100%; margin-top: var(--s1); }
.ar-stage.swap .ar-scene { animation: ar-wipe .18s steps(3, end) both; }
@keyframes ar-wipe { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0); } }
.ar-note { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); margin-top: var(--s2); }
.ar-note b { white-space: nowrap; font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; line-height: 1; color: var(--ar-c); text-shadow: 2px 2px 0 var(--ink); }
.ar-note span { font-size: 11px; color: var(--muted); text-align: right; }

/* the scene itself is the picker: swipe it to change world */
.ar-stage { touch-action: pan-y; cursor: grab; user-select: none; }
.ar-stage.in-next .ar-scene { animation: swp-in-next .22s steps(4, end); }
.ar-stage.in-prev .ar-scene { animation: swp-in-prev .22s steps(4, end); }
.ar-stage .swp-arrow { margin-top: -22px; }
.ar-dots { margin-top: var(--s1); }
.ar-desc { margin: 0; font-size: 12px; color: var(--muted); }
.ar-desc b { color: var(--text); }
.ar-def { --tag-c: var(--cls-c); font-size: 10px; margin-left: var(--s2); vertical-align: 3px; }
</style>
</head>
<body class="px">
<main class="phone" data-screen="area">
  <header class="topbar setup-top">
    <button class="icon-btn" type="button" id="ar-back" aria-label="Back to difficulty"></button>
    <div class="setup-t">
      <div class="setup-k"><p class="kicker" id="ar-kicker">STEP 4 OF 5</p><div class="steps" role="img" aria-label="Setup step 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i><i></i></div></div>
      <h1 class="title">Where do you train?</h1>
    </div>
  </header>

  <section class="screen ar-screen">
    <div>
      <div class="ar-stage" id="ar-stage" role="group" aria-roledescription="carousel" aria-label="Starting area">
        <div id="ar-scene-host"></div>
        <button class="swp-arrow is-prev" type="button" id="ar-prev" aria-label="Previous world"></button>
        <button class="swp-arrow is-next" type="button" id="ar-nextw" aria-label="Next world"></button>
      </div>
      <div class="ar-note"><b id="ar-name"></b><span>Swipe for other worlds.</span></div>
      <div class="swp-dots ar-dots" id="ar-dots" role="tablist" aria-label="Worlds"></div>
    </div>
    <p class="ar-desc" id="ar-desc"></p>
    <p class="sr-only" id="ar-live" role="status" aria-live="polite"></p>
  </section>

  <footer class="foot">
    <button class="btn cta" type="button" id="ar-next">NEXT: REVIEW</button>
  </footer>
</main>

<!-- ======================================================================
     AREA SCENES (JS). renderScene(container, areaId, opts) draws one area.
     opts: { interactive: bool, count: n (records shown, 0-12), character, onSet(count) }
     Returns { el, hit(), setCount(n), count() }.
     interactive: the action object is a <button> with a dashed ring and a
     bobbing hint; a tap shakes the scene, plays the area effect and a
     "+1 SET" (or 5th-mark stamp) burst, and adds one record.
     ====================================================================== -->
<script>
(function () {
  "use strict";
  var LADDER = ["#c9b8e8", "#c6ff3d", "#3fd2ff", "#a77bff", "#ffa033", "#ff5fb0"];
  var MAX = 12;
  function rung(i) { return LADDER[Math.min(i, LADDER.length - 1)]; }
  var STAR = "clip-path: polygon(50% 0,61% 30%,93% 18%,74% 45%,100% 62%,68% 66%,72% 100%,50% 76%,28% 100%,32% 66%,0 62%,26% 45%,7% 18%,39% 30%)";
  function reduced() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }

  /* Each scene: bg (scene background), art (static/looping details), obj (the action
     object's inner spans), hit (button box), rec (records container html), records(n, newest),
     fx(n) (effect spans), burst position and colour. */
  var SCENES = {
    riptide: {
      bg: "background: #12061f",
      art:
        '<div class="ar-stars"></div>' +
        '<div style="right: 96px; top: 36px; width: 46px; height: 46px; border-radius: 50%; background: #f6eeff; border: 3px solid #0b0414; box-shadow: inset -10px -6px 0 #c9b8e8, inset 6px 8px 0 -3px #ecd7d0"></div>' +
        '<div style="left: 0; right: 0; bottom: 70px; height: 110px; background-color: #2a1148; background-image: repeating-linear-gradient(0deg, transparent 0 9px, #3a2a52 9px 11px); border-top: 3px solid #0b0414"></div>' +
        '<div style="right: 104px; bottom: 86px; width: 36px; height: 80px; background: repeating-linear-gradient(0deg, #c9b8e8 0 3px, transparent 3px 9px); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); opacity: .8"></div>' +
        '<div style="left: 116px; bottom: 177px; width: 60px; height: 9px; background: #1f0d36; border-radius: 50% 50% 0 0"></div>' +
        '<div style="left: 142px; bottom: 183px; width: 4px; height: 28px; background: #1f0d36; transform: rotate(8deg)"></div>' +
        '<div style="left: 128px; bottom: 204px; width: 36px; height: 15px; background: #1f0d36; clip-path: polygon(50% 40%, 100% 100%, 70% 50%, 50% 0, 30% 50%, 0 100%)"></div>' +
        '<div style="left: 0; right: 0; bottom: 70px; height: 8px; background: repeating-linear-gradient(90deg, #3fd2ff 0 16px, #88dff3 16px 20px, transparent 20px 30px); border-top: 2px solid #0b0414; animation: ar-waves 1.6s steps(6,end) infinite"></div>' +
        '<div style="left: 0; right: 0; bottom: 118px; height: 3px; background: repeating-linear-gradient(90deg, #3fd2ff 0 10px, transparent 10px 34px); opacity: .7; animation: ar-waves 2.4s steps(6,end) infinite reverse"></div>' +
        '<div style="left: 0; right: 0; bottom: 0; height: 72px; background-color: #ad9293; background-image: radial-gradient(#8a6f73 1.2px, transparent 1.8px), radial-gradient(#ecd7d0 1px, transparent 1.5px); background-size: 13px 9px, 19px 11px; border-top: 4px solid #0b0414; box-shadow: inset 0 8px 0 #6b5033"></div>' +
        '<div style="right: 14px; bottom: 72px; width: 14px; height: 130px; background: repeating-linear-gradient(0deg, #6b5033 0 10px, #4b2d19 10px 12px); border: 3px solid #0b0414; transform: rotate(6deg); transform-origin: bottom"></div>' +
        '<div style="right: -16px; bottom: 190px; width: 92px; height: 48px; background: #4b2a7a; clip-path: polygon(50% 40%, 100% 70%, 62% 52%, 90% 100%, 50% 58%, 10% 100%, 38% 52%, 0 70%, 50% 40%, 30% 0, 50% 30%, 70% 0); animation: ar-sway 2s steps(2,end) infinite"></div>' +
        '<div style="left: 226px; bottom: 50px; width: 18px; height: 18px; background: #ff5fb0; clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%)"></div>',
      hit: "left: 128px; bottom: 22px; width: 84px; height: 74px",
      label: "Open the treasure chest",
      obj:
        '<span style="left: 6px; top: 34px; width: 72px; height: 10px; background: #ffc075; border: 3px solid #0b0414"></span>' +
        '<span style="left: 2px; bottom: 0; width: 80px; height: 44px; box-sizing: border-box; border: 3px solid #0b0414; background: linear-gradient(90deg, #6b5033 0 12px, #ffa033 12px 22px, #6b5033 22px 56px, #ffa033 56px 66px, #6b5033 66px); box-shadow: inset 0 -6px 0 #4b2d19"></span>' +
        '<span style="left: 34px; bottom: 18px; width: 14px; height: 16px; background: #ffa033; border: 2px solid #0b0414; box-shadow: inset 0 -5px 0 #a6643c"></span>' +
        '<span class="ar-lid" style="left: 0; bottom: 40px; width: 84px; height: 26px; box-sizing: border-box; border: 3px solid #0b0414; border-radius: 16px 16px 0 0; background: linear-gradient(90deg, #6b5033 0 14px, #ffa033 14px 24px, #6b5033 24px 58px, #ffa033 58px 68px, #6b5033 68px); box-shadow: inset 0 5px 0 #a6643c"></span>',
      rec: '<div data-rec style="right: 8px; bottom: 6px; width: 86px; height: 64px; z-index: 4; display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start; gap: 1px"></div>',
      records: function (n, nw) {
        var h = "";
        for (var i = 0; i < n; i++) h += '<span class="' + (i % 5 === 4 ? "ar-pearl" : "ar-shell") + (i === nw ? " ar-new" : "") + '"></span>';
        return h;
      },
      fx: function (n) { return '<span class="ar-flyer ' + (n % 5 === 0 ? "ar-pearl" : "ar-shell") + '" style="left: 160px; bottom: 96px"></span>'; },
      burst: "left: 130px; bottom: 120px", color: function () { return "#ff5fb0"; }
    },

    gainsgard: {
      bg: "background-color: #3a2a52; background-image: repeating-linear-gradient(0deg, #2a1148 0 3px, transparent 3px 26px), repeating-linear-gradient(90deg, #2a1148 0 3px, transparent 3px 44px)",
      art:
        '<div style="left: 16px; top: 50px; width: 64px; height: 90px; background-color: #1a0b3b; background-image: radial-gradient(#f6eeff 1px, transparent 1.6px); background-size: 13px 17px; border: 4px solid #0b0414; border-radius: 32px 32px 0 0; box-shadow: inset 0 0 0 4px #4b2a7a"></div>' +
        '<div style="left: 45px; top: 54px; width: 6px; height: 86px; background: #0b0414"></div>' +
        '<div style="left: 20px; top: 92px; width: 56px; height: 5px; background: #0b0414"></div>' +
        '<div style="left: 0; top: 144px; width: 100px; height: 84px; background: rgba(201,184,232,.12); clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%)"></div>' +
        '<div style="left: 98px; top: 0; width: 4px; height: 44px; background: repeating-linear-gradient(0deg, #8672a5 0 6px, #0b0414 6px 8px)"></div>' +
        '<div style="left: 128px; top: 0; width: 42px; height: 70px; background: #a77bff; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%); box-shadow: inset 6px 0 0 #c8a9f3, inset -6px 0 0 #724eb2"></div>' +
        '<div style="left: 140px; top: 24px; width: 18px; height: 6px; background: #0b0414; box-shadow: -6px 0 0 0 #0b0414, 6px 0 0 0 #0b0414, -6px -4px 0 0 #0b0414, -6px 4px 0 0 #0b0414, 6px -4px 0 0 #0b0414, 6px 4px 0 0 #0b0414"></div>' +
        '<div style="left: 232px; top: 0; width: 42px; height: 70px; background: #ff5fb0; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%); box-shadow: inset 6px 0 0 #ff98c2, inset -6px 0 0 #a63e84"></div>' +
        '<div style="left: 244px; top: 24px; width: 18px; height: 6px; background: #0b0414; box-shadow: -6px 0 0 0 #0b0414, 6px 0 0 0 #0b0414, -6px -4px 0 0 #0b0414, -6px 4px 0 0 #0b0414, 6px -4px 0 0 #0b0414, 6px 4px 0 0 #0b0414"></div>' +
        '<div style="left: 177px; top: 28px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,160,51,.18)"></div>' +
        '<div style="left: 196px; top: 50px; width: 10px; height: 26px; background: #6b5033; border: 2px solid #0b0414"></div>' +
        '<div style="left: 192px; top: 26px; width: 18px; height: 24px; background: #ffa033; border: 2px solid #0b0414; border-radius: 50% 50% 20% 20%; box-shadow: inset 0 -8px 0 #ff5fb0, inset 0 5px 0 #ffc075; transform-origin: bottom; animation: ar-flick .5s steps(3,end) infinite"></div>' +
        '<div style="right: 8px; bottom: 74px; width: 54px; height: 60px; border: 3px solid #0b0414; border-bottom: 0; background: repeating-linear-gradient(0deg, transparent 0 18px, #6b5033 18px 22px)"></div>' +
        '<div style="right: 18px; bottom: 112px; width: 34px; height: 4px; background: #c9b8e8; border: 1px solid #0b0414; box-shadow: -3px -4px 0 0 #0b0414, 31px -4px 0 0 #0b0414"></div>' +
        '<div style="right: 18px; bottom: 90px; width: 34px; height: 4px; background: #c9b8e8; border: 1px solid #0b0414; box-shadow: -3px -5px 0 1px #0b0414, 31px -5px 0 1px #0b0414"></div>' +
        '<div style="left: 0; right: 0; bottom: 0; height: 72px; background-color: #8672a5; background-image: repeating-linear-gradient(90deg, #593597 0 3px, transparent 3px 52px), repeating-linear-gradient(0deg, #593597 0 3px, transparent 3px 22px); border-top: 4px solid #0b0414; box-shadow: inset 0 6px 0 #ad8ed6"></div>' +
        '<div style="left: 0; bottom: 8px; width: 210px; height: 34px; background: #a63e84; border: 3px solid #0b0414; box-shadow: inset 0 0 0 3px #ffa033; transform: skewX(-20deg); transform-origin: bottom left"></div>',
      hit: "left: 124px; top: 88px; width: 150px; height: 132px",

<script>
(function () {
  "use strict";
  if (!PX.require(["cls"], "class")) return;

  var st = PX.get();
  var myCls = PX.cls();
  var current = PX.area(st.area) ? st.area : (myCls && myCls.area) || "riptide";
  if (current !== st.area) PX.save({ area: current });

  var stage = document.getElementById("ar-stage");
  var nameEl = document.getElementById("ar-name");
    var live = document.getElementById("ar-live");

  var back = document.getElementById("ar-back");
  back.innerHTML = PX.icon("back");
  back.onclick = function () { PX.go("difficulty"); };
  var edit = PX.editMode();
  document.getElementById("ar-next").addEventListener("click", function () {
    if (edit) { PX.toast("MOVED TO " + PX.area().name.toUpperCase() + ".", { ms: 1200 }); setTimeout(function () { PX.go("profile"); }, 800); }
    else PX.go("summary");
  });
  if (edit) {
    var kk = document.getElementById("ar-kicker"); kk.textContent = "PROFILE · CHANGE WORLD"; kk.classList.add("edit-kicker");
    document.querySelector(".steps").hidden = true;
    document.getElementById("ar-next").textContent = "SAVE WORLD";
    back.setAttribute("aria-label", "Back to the profile");
    back.onclick = function () { PX.go("profile"); };
  }

  var host = document.getElementById("ar-scene-host");
  var dots = document.getElementById("ar-dots");
  var IDS = PX.AREA_ORDER;

  function showPreview(id, dir) {
    var a = PX.area(id);
    renderScene(host, id, {
      interactive: true, count: 0,
      onSet: function (n, stamp) { live.textContent = stamp + " Practice set " + n + ". Nothing is saved."; }
    });
    nameEl.textContent = a.name;
    nameEl.style.setProperty("--ar-c", PX.c(a.color));
    stage.style.setProperty("--swp-c", PX.c(a.color));
    dots.style.setProperty("--dot-c", PX.c(a.color));
    var isDefault = myCls && a.defaultFor === myCls.id;
    document.getElementById("ar-desc").innerHTML = "<b>" + a.hint + ".</b> Every set leaves a mark: " + a.record.toLowerCase() + ". Practice taps don't count." +
      (isDefault ? ' <span class="nametag ar-def" style="--cls-c:' + PX.c(myCls.color) + '">DEFAULT FOR YOUR PATH</span>' : "");
    dots.querySelectorAll("button").forEach(function (b, j) { b.setAttribute("aria-current", String(IDS[j] === id)); b.setAttribute("aria-selected", String(IDS[j] === id)); });
    if (dir) { stage.classList.remove("in-next", "in-prev"); void stage.offsetWidth; stage.classList.add(dir > 0 ? "in-next" : "in-prev"); }
  }

  IDS.forEach(function (id) {
    var b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-label", PX.area(id).name);
    b.onclick = function () { pick(id, true); };
    dots.appendChild(b);
  });

  function pick(id, user, dir) {
    if (id === current && user) return;
    var from = IDS.indexOf(current), to = IDS.indexOf(id);
    current = id;
    if (user) PX.save({ area: id });
    showPreview(id, user ? (dir || (to > from ? 1 : -1)) : 0);
  }
  function step(d) { pick(IDS[(IDS.indexOf(current) + d + IDS.length) % IDS.length], true, d); }

  var prevB = document.getElementById("ar-prev"), nextB = document.getElementById("ar-nextw");
  prevB.innerHTML = PX.icon("back"); nextB.innerHTML = PX.icon("back");
  prevB.onclick = function () { step(-1); };
  nextB.onclick = function () { step(1); };
  stage.addEventListener("keydown", function (e) {
    if (e.target.closest(".ar-hit")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); } else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  });
  PX.swipe(stage, step, function (dx) {
    var sc = host.firstChild; if (!sc) return;
    sc.style.transform = dx ? "translateX(" + dx * .6 + "px) rotate(" + dx / 60 + "deg)" : "";
  });

  pick(current, false);

  /* screenshot helper for the demo: ?pick=<areaId>&tap=n */
  var q = /[?&]pick=(\w+)/.exec(location.search);
  if (q && PX.area(q[1])) pick(q[1], true);
  var t = /[?&]tap=(\d+)/.exec(location.search);
  if (t) setTimeout(function () { var btn = stage.querySelector(".ar-hit"); for (var k = 0; k < +t[1]; k++) btn.click(); }, 1100);
})();
</script>
</body>
</html>

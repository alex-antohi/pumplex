name: gym_app
description: "PUMPLEX: train, not track"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Only packages already in the local pub cache (same versions as doc_app).
dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  shared_preferences: 2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/body/body_atlas.png
    - assets/icons/
    - assets/outfits/
    - assets/gear/head/
    - assets/gear/top/
    - assets/gear/bottom/
    - assets/gear/shoes/
    - assets/gear/weapon/
    - assets/gear/icons/
    - assets/areas/riptide/
    - assets/areas/gainsgard/
    - assets/areas/rustbelt/
    - assets/areas/arcade/
    - assets/areas/frostbite/
    - assets/sounds/
  # Design fonts (docs/moodboard/fonts, OFL licences in assets/fonts).
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
  shaders:
    - shaders/cel.frag
